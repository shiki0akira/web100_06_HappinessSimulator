<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/happiness/shared/logo.svg">
<title>幸福模擬器 · 第三關 萬世巨星 · 主畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/happiness/shared/pixel.css">
<script src="/happiness/shared/theme.js"></script>
<style>
  /* 主畫面會用 HDMI 接 43–75 吋電視，觀看距離 2–4 公尺。
     字級隨畫面寬度整體放大，--u 是縮放係數。 */
  :root { --u: 1; }
  @media (min-width: 1500px) { :root { --u: 1.22; } }
  @media (min-width: 1900px) { :root { --u: 1.5; } }
  @media (min-width: 2560px) { :root { --u: 2; } }

  body { overflow: hidden; }
  .app { display: grid; grid-template-rows: auto 1fr auto auto; height: 100vh; }

  .top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; border-bottom: 4px solid var(--edge); background: var(--surface);
  }
  .top h1 { font-size: calc(19px * var(--u)); font-weight: 900; }
  .top h1 a { color: inherit; text-decoration: none; border-bottom: 3px solid transparent; }
  .top h1 a:hover, .top h1 a:focus-visible { color: var(--root-c); border-bottom-color: var(--root-c); }
  .top .spacer { flex: 1; }
  .top .count { font-family: var(--pixel); font-size: calc(15px * var(--u)); color: var(--ink-2); }
  .notesbtn { font-family: var(--sans); font-size: calc(13px * var(--u)); font-weight: 700;
    padding: calc(7px * var(--u)) calc(12px * var(--u));
    border: 3px solid var(--gold); background: transparent; color: var(--gold); }
  .notesbtn:hover { background: var(--gold); color: var(--surface); }
  .top .themebtn { font-size: calc(13px * var(--u)); padding: calc(7px * var(--u)) calc(10px * var(--u)); }

  .body { display: grid; grid-template-columns: calc(272px * var(--u)) 1fr; min-height: 0; }

  .side { border-right: 4px solid var(--edge); background: var(--surface); overflow-y: auto; padding: calc(10px * var(--u)); }
  .side h4 { font-family: var(--pixel); font-size: calc(15px * var(--u)); letter-spacing: .06em; color: var(--ink-3); margin: 0 0 calc(8px * var(--u)); text-transform: uppercase; }
  .prow { padding: calc(5px * var(--u)) 0; border-bottom: 2px dashed var(--edge-soft); }
  .prow .nm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.25;
    font-size: calc(14px * var(--u)); font-weight: 700; }
  /* 爬完那一下的漲跌一起印出來：先 +N 再 −M，看得到那個波動 */
  .prow .nm .drop { font-family: var(--pixel); font-size: calc(13px * var(--u)); color: var(--vol); }
  .prow .nm .up { font-family: var(--pixel); font-size: calc(13px * var(--u)); color: var(--root-c); }
  /* 這一關一正一負，會有人掉分 —— 側欄要吃得下負號 */
  .prow .nm .down { font-family: var(--pixel); font-size: calc(13px * var(--u)); color: var(--vol); }
  .prow .g { display: flex; align-items: center; gap: 8px; margin-top: calc(3px * var(--u)); line-height: 1.15;
    font-family: var(--pixel); font-size: calc(13px * var(--u)); color: var(--ink-3); }
  .prow .g .lbl { flex: none; width: 4.4em; }
  .prow .g .bar { flex: 1; min-width: 0; height: calc(10px * var(--u)); }
  .prow .g b { flex: none; width: 2.6em; text-align: right; font-size: calc(14px * var(--u)); }
  .prow .meta { margin-top: calc(3px * var(--u)); line-height: 1.2;
    font-size: calc(13px * var(--u)); color: var(--ink-3); font-family: var(--pixel); }
  .prow .meta.keep { font-family: var(--sans); font-weight: 700; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-family: var(--sans); font-size: calc(13px * var(--u)); font-weight: 700; padding: 1px 6px; border: 2px solid var(--edge-soft); background: var(--surface-2); color: var(--ink-2); }
  .chip.on { border-color: var(--root-c); background: var(--root-soft); color: var(--root-c); }

  /* 每一頁都要在一個畫面裡看完 —— overflow 只是保險，不是排版手段 */
  .stage { padding: calc(22px * var(--u)) calc(40px * var(--u)); overflow-y: auto; display: flex; flex-direction: column; }
  .stage h2 { font-size: min(calc(40px * var(--u)), 5.6vh); font-weight: 900; letter-spacing: .02em; }
  .stage .kicker, .col3 .kicker { font-size: calc(20px * var(--u)); color: var(--ink-2); margin-bottom: 10px; }
  .stage .lede { font-size: calc(17px * var(--u)); color: var(--ink-2); max-width: 62ch; margin: 10px 0 0; }
  .big { font-size: min(calc(76px * var(--u)), 10vh); font-family: var(--pixel); line-height: 1.1; }
  .mono { font-family: var(--pixel); }
  .muted { color: var(--ink-3); }

  .receive { display: flex; align-items: center; gap: calc(24px * var(--u)); margin-top: calc(22px * var(--u)); }
  .receive .stageart { margin: 0; }
  .receive .stageart img { width: min(calc(200px * var(--u)), 22vh); }
  .counter { margin-top: calc(18px * var(--u)); }
  .receive .counter { margin-top: 0; }

  .qrbox { display: flex; gap: 34px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
  .qrbox > div { flex: 1 1 280px; min-width: 0; }
  .qrbox canvas { border: 4px solid var(--edge); background: #fff; padding: 6px;
    image-rendering: pixelated; box-shadow: 8px 8px 0 var(--hard); position: relative; z-index: 95; }
  .roomcode { font-family: var(--pixel); font-size: calc(64px * var(--u)); color: var(--gold); letter-spacing: .14em; margin-top: 8px; }
  .url { font-family: var(--pixel); font-size: calc(24px * var(--u)); line-height: 1.8; color: var(--root-c); word-break: break-all; }
  .names { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .names span { padding: 6px 12px; background: var(--surface); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--hard); font-size: calc(15px * var(--u)); font-weight: 700; }

  /* ── 猜句子 ───────────────────────────────────────────────────────── */
  /* 題號和出處跟標題同一行 */
  .qtop { display: flex; align-items: baseline; gap: calc(20px * var(--u)); flex-wrap: wrap; }
  .qtop .qn { font-family: var(--pixel); font-size: calc(22px * var(--u)); color: var(--gold); }
  .qtop .qn small { color: var(--ink-3); font-size: calc(15px * var(--u)); }
  /* 出處：揭答案之後接在標題底下，佔「幾人已作答」原本那一行 */
  .qsrcline { margin-top: calc(6px * var(--u));
    font-size: calc(19px * var(--u)); font-weight: 700; color: var(--root-c); }
  /* 「幾人已作答」是給主持人等人的一行小字，不是這一頁的主角 */
  .qcount { margin-top: calc(6px * var(--u)); font-family: var(--pixel);
    font-size: calc(15px * var(--u)); color: var(--ink-3); }
  .qcount.all { color: var(--root-c); }
  .qcount b { font-family: var(--sans); font-size: calc(15px * var(--u)); }
  /* 那句話本身就是這一頁的主角，字要夠大 */
  .quote { font-size: min(calc(42px * var(--u)), 6.2vh); font-weight: 900; line-height: 1.6;
    max-width: 21em; margin: min(calc(14px * var(--u)), 2vh) 0; }
  /* 揭答案之後：對的那一行亮起來，其他兩行淡下去。**沒有紅色** */
  .opts.quiz .opt .lbl { width: calc(230px * var(--u)); }
  .opts.quiz .opt.right .lbl { color: var(--root-c); }
  .opts.quiz .opt.right .track { border-color: var(--root-c); }
  .opts.quiz .opt.right .track i { background: var(--root-c); }
  .opts.quiz .opt.pale { opacity: .5; }
  .opts.quiz .opt.pale .track i { background: var(--ink-3); }

  /* 揭曉那一頁：八題排開，他說的那四句亮起來 */
  .quotelist { margin-top: min(calc(12px * var(--u)), 1.8vh); border-top: 3px solid var(--edge-soft); }
  .qrow { display: flex; align-items: baseline; gap: calc(16px * var(--u));
    padding: min(calc(7px * var(--u)), 1vh) 0; border-bottom: 2px dashed var(--edge-soft); opacity: .55; }
  .qrow .t { flex: 1; font-size: min(calc(18px * var(--u)), 2.6vh); font-weight: 700; min-width: 0; }
  .qrow .by { flex: none; width: calc(150px * var(--u)); text-align: right;
    font-size: min(calc(16px * var(--u)), 2.3vh); color: var(--ink-3); }
  .qrow.jesus { opacity: 1; }
  .qrow.jesus .t { color: var(--root-c); }
  .qrow.jesus .by { color: var(--root-c); font-weight: 900; }
  .quotelist.dense .qrow { padding: min(calc(5px * var(--u)), .8vh) 0; }

  /* 揭曉：左邊聚光燈下的他，右邊他留在生活裡的那四樣 */
  .starwrap { flex: 1; display: grid; grid-template-columns: auto 1fr;
    gap: calc(34px * var(--u)); align-items: center;
    margin-top: min(calc(10px * var(--u)), 1.4vh); }
  /* 他要夠大 —— 這一頁是「我想介紹這一位」，他就是主角，不是插圖 */
  .starart img { display: block; width: min(calc(300px * var(--u)), 52vh); height: auto;
    image-rendering: pixelated; }
  .starcol { min-width: 0; }
  .starcol .quotelist { margin-top: 0; }

  /* 他留在生活裡的東西。四格都是陳述句 —— 這一排不是題目。 */
  .traces { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(12px * var(--u));
    margin-top: min(calc(16px * var(--u)), 2.2vh); }
  /* 搬到他旁邊之後改成直的一欄，四格由上往下，跟他一樣高 */
  .starcol .traces { grid-template-columns: 1fr; gap: min(calc(10px * var(--u)), 1.4vh);
    margin-top: 0; }
  .starcol .trace { padding: min(calc(10px * var(--u)), 1.5vh) calc(18px * var(--u)); }
  .starcol .trace b { font-size: min(calc(24px * var(--u)), 3.2vh); }
  .starcol .trace span { font-size: min(calc(18px * var(--u)), 2.4vh); }
  .trace { background: var(--surface); border: 4px solid var(--edge); box-shadow: 5px 5px 0 var(--hard);
    padding: min(calc(12px * var(--u)), 1.6vh) calc(12px * var(--u)); }
  .trace b { display: block; font-size: min(calc(19px * var(--u)), 2.7vh); line-height: 1.4; }
  .trace span { display: block; margin-top: 4px; font-size: min(calc(15px * var(--u)), 2.1vh); color: var(--gold); }
  .traceline { margin-top: min(calc(14px * var(--u)), 2vh); font-size: min(calc(26px * var(--u)), 3.6vh);
    font-weight: 900; color: var(--ink); }

  /* ── 罪 ──────────────────────────────────────────────────────────── */
  .misskey { font-size: min(calc(34px * var(--u)), 4.8vh); font-weight: 900; line-height: 1.6;
    max-width: 26em; margin: min(calc(12px * var(--u)), 1.8vh) 0; color: var(--gold); }
  /* 作答中：八個選項攤在大螢幕上。四欄兩列，每格一樣大。 */
  .sinboard { display: grid; grid-template-columns: repeat(4, 1fr);
    gap: min(calc(10px * var(--u)), 1.5vh); margin-top: min(calc(16px * var(--u)), 2.2vh); }
  .sintile { background: var(--surface); border: 4px solid var(--edge); box-shadow: 5px 5px 0 var(--hard);
    padding: min(calc(14px * var(--u)), 2vh) calc(12px * var(--u));
    font-size: min(calc(21px * var(--u)), 3vh); font-weight: 700; line-height: 1.4; }
  .opts.sin .opt .lbl { width: calc(280px * var(--u)); }
  .opts.sin.dense { gap: min(calc(6px * var(--u)), .9vh); }
  .opts.sin.dense .track { height: min(calc(18px * var(--u)), 2.6vh); }
  .opts.sin.dense .lbl { font-size: calc(17px * var(--u)); }

  /* 死後還有審判。整頁就這五個字，不要再多。 */
  .judge { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .judge h2 { font-size: min(calc(96px * var(--u)), 13vh); letter-spacing: .12em; }
  .judge p { margin-top: calc(20px * var(--u)); font-size: min(calc(26px * var(--u)), 3.4vh); color: var(--ink-2); }

  /* ── 人生模擬器：五個岔路 ─────────────────────────────────────────── */
  /* 公布過的岔路留在上面，那是地圖的形狀。只留人數和加減，名字在下面那兩格。 */
  .trail { margin-top: min(calc(8px * var(--u)), 1.2vh); border-left: 6px solid var(--edge-soft);
    padding-left: calc(14px * var(--u)); }
  .trailrow { display: flex; align-items: baseline; gap: calc(20px * var(--u));
    padding: min(calc(2px * var(--u)), .3vh) 0; }
  .trailrow .age { flex: none; width: calc(56px * var(--u)); font-family: var(--pixel);
    font-size: calc(13px * var(--u)); color: var(--ink-3); }
  .trailrow .side { flex: 1; min-width: 0; font-size: min(calc(15px * var(--u)), 2vh); font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trailrow .side i { font-style: normal; font-family: var(--pixel);
    font-size: min(calc(14px * var(--u)), 2vh); margin-left: 10px; }
  .trailrow .side em { font-style: normal; font-weight: 500; margin-left: 10px;
    font-size: min(calc(14px * var(--u)), 2vh); color: var(--ink-3); }
  .trailrow .side.up i { color: var(--root-c); }
  .trailrow .side.down i { color: var(--vol); }

  /* 現在這一個岔路：左右兩大格。誰選了哪一邊，選完馬上出現在格子裡。 */
  .forkbox { margin-top: min(calc(12px * var(--u)), 1.8vh); }
  .forkage { font-family: var(--pixel); font-size: min(calc(22px * var(--u)), 3vh); color: var(--gold); }
  .forks { display: grid; grid-template-columns: 1fr 1fr; gap: calc(16px * var(--u));
    margin-top: min(calc(10px * var(--u)), 1.5vh); align-items: start; }
  /* 「幾人已選」不要黏在兩個格子底下 —— 那是給主持人等人的一行小字，
     黏太近會看起來像左邊那一格的附註 */
  .phase-map .qcount { margin-top: min(calc(18px * var(--u)), 2.6vh); }
  .fk { background: var(--surface); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard);
    padding: min(calc(16px * var(--u)), 2.4vh) calc(18px * var(--u)); }
  .fkhd { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: calc(8px * var(--u)); }
  .fk .tag2 { display: inline-block; font-family: var(--pixel); font-size: calc(16px * var(--u));
    color: var(--gold); border: 3px solid var(--gold); padding: 1px 8px; }
  .fk .fkd { font-family: var(--pixel); font-size: min(calc(34px * var(--u)), 4.4vh); }
  .fk b { display: block; font-size: min(calc(24px * var(--u)), 3.2vh); line-height: 1.45; }
  /* 選了就馬上出現在這裡 —— 這一行就是「大家選完了沒」 */
  .fkwho { margin-top: min(calc(6px * var(--u)), 1vh); min-height: 1.4em;
    font-size: min(calc(17px * var(--u)), 2.4vh); font-weight: 700; color: var(--vol); line-height: 1.5; }
  .fkres { margin-top: min(calc(6px * var(--u)), 1vh); padding-top: min(calc(6px * var(--u)), 1vh);
    border-top: 2px dashed var(--edge-soft);
    font-size: min(calc(17px * var(--u)), 2.3vh); line-height: 1.55; color: var(--ink-2); }
  .fk.win { border-color: var(--root-c); }
  .fk.win .fkd { color: var(--root-c); }
  .fk.lose .fkd { color: var(--vol); }

  /* 結局頁：三十二條全部攤開，兩塊。
     上面那塊是**有人走到的**：大一格、而且把那五步印出來 ——
     「+13 你換跑道那年…」看不出他是怎麼走到那裡的。
     下面那塊是沒有人走到的人生，淡淡地排著。
     三十二條一定要塞在一個畫面裡，所以行高和字級都封了頂。 */
  .endmine { margin-top: min(calc(6px * var(--u)), .9vh); display: grid;
    grid-template-columns: 1fr 1fr; gap: min(calc(4px * var(--u)), .6vh) calc(24px * var(--u)); }
  .emine { background: var(--surface); border-left: 8px solid var(--vol);
    padding: min(calc(2px * var(--u)), .3vh) calc(12px * var(--u)); }
  .eline { display: flex; align-items: baseline; gap: calc(10px * var(--u)); line-height: 1.25; }
  .eline .tot { flex: none; width: calc(52px * var(--u)); text-align: right;
    font-family: var(--pixel); font-size: min(calc(17px * var(--u)), 2.3vh); }
  .eline .tot.up { color: var(--root-c); }
  .eline .tot.down { color: var(--vol); }
  .eline .txt { flex: 1; min-width: 0; font-size: min(calc(17px * var(--u)), 2.3vh);
    font-weight: 700; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eline .who { flex: none; max-width: calc(140px * var(--u));
    font-size: min(calc(14px * var(--u)), 1.9vh); font-weight: 700; color: var(--vol);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 他按過的那五下 */
  .epath { margin-left: calc(62px * var(--u)); line-height: 1.2;
    font-size: min(calc(13px * var(--u)), 1.75vh); color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .epath span { font-weight: 700; color: var(--ink-2); }
  .epath i { font-style: normal; margin: 0 5px; }
  .endmine.dense .emine { padding: 0 calc(10px * var(--u)); }
  .endmine.dense .eline .txt, .endmine.dense .eline .tot { font-size: min(calc(15px * var(--u)), 2vh); }
  .endmine.dense .eline { line-height: 1.15; }
  .endmine.dense .epath { line-height: 1.1; font-size: min(calc(11px * var(--u)), 1.5vh); }
  .endrest.dense .erow { line-height: 1.2; }

  /* 沒有人走到的那些：一行一條，兩欄 */
  .endrest { margin-top: min(calc(6px * var(--u)), .9vh); display: grid;
    grid-template-columns: 1fr 1fr; column-gap: calc(24px * var(--u)); }
  .erow { display: flex; align-items: baseline; gap: calc(10px * var(--u)); line-height: 1.3;
    padding: 0; border-bottom: 1px dashed var(--edge-soft); }
  .erow .tot { flex: none; width: calc(46px * var(--u)); text-align: right;
    font-family: var(--pixel); font-size: min(calc(13px * var(--u)), 1.7vh); opacity: .45; }
  .erow .tot.up { color: var(--root-c); }
  .erow .tot.down { color: var(--vol); }
  .erow .txt { flex: 1; min-width: 0; font-size: min(calc(14px * var(--u)), 1.8vh); color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .endrest.dense .erow .tot, .endrest.dense .erow .txt { font-size: min(calc(12px * var(--u)), 1.55vh); }
  .endline { margin-top: min(calc(6px * var(--u)), .9vh);
    font-size: min(calc(22px * var(--u)), 2.9vh); font-weight: 900; }

  /* 整頁只有一句話的版型。畫面上不放解釋 —— 那是主持人的工作。 */
  .solo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  /* **這一句不准斷行。** 一斷行「選擇？」會自己掉到第二行，問句就散了 ——
     所以不吃 max-width，改成一行到底，字級跟著版面寬度縮。 */
  .solo h2 { font-size: min(calc(64px * var(--u)), 9vh, 4vw); line-height: 1.45;
    letter-spacing: .04em; max-width: none; white-space: nowrap; }

  /* 問句底下那一句。**問句是主角，這一句是註腳** —— 字級差一倍以上。 */
  .sololine { margin-top: min(calc(22px * var(--u)), 3vh); max-width: 34em;
    font-size: min(calc(24px * var(--u)), 3.2vh); line-height: 1.8; color: var(--ink-2); }

  /* 因為罪：七宗罪貼成標籤 */
  .big-lede { font-size: min(calc(26px * var(--u)), 3.4vh) !important; max-width: 40em;
    margin-top: min(calc(14px * var(--u)), 2vh) !important; }
  /* 七個標籤排成四欄，4 ＋ 3 —— 用 flex 換行會變成 6 ＋ 1，最後一個很孤單 */
  .sintags { display: grid; grid-template-columns: repeat(4, 1fr);
    gap: min(calc(14px * var(--u)), 2vh) calc(14px * var(--u));
    margin-top: min(calc(26px * var(--u)), 3.4vh); }
  .sintag { display: flex; flex-direction: column; gap: calc(4px * var(--u));
    background: var(--surface); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard);
    padding: min(calc(12px * var(--u)), 1.8vh) calc(22px * var(--u)); }
  .sintag b { font-size: min(calc(34px * var(--u)), 4.4vh); line-height: 1.2; letter-spacing: .06em; }
  .sintag i { font-style: normal; font-size: min(calc(17px * var(--u)), 2.3vh); color: var(--gold); }

  /* 他來，是要叫我們得生命：那兩行 */
  .sinlines { margin-top: min(calc(14px * var(--u)), 2vh); }
  .sinlines p { margin: 0 0 min(calc(10px * var(--u)), 1.4vh);
    font-size: min(calc(22px * var(--u)), 3.1vh); line-height: 1.8; color: var(--ink-2); }

  /* 萬世巨星的開場白：燈亮著，光裡還沒有人 */
  .teaser { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .teaser .big-title { font-size: min(calc(72px * var(--u)), 9vh); letter-spacing: .14em; }
  .teaseart img { display: block; width: min(calc(200px * var(--u)), 34vh); height: auto;
    image-rendering: pixelated; margin-top: min(calc(10px * var(--u)), 1.4vh); }

  /* 藉著他到父那裡去：排成 RPG 的關卡地圖 —— 三個節點，中間有路連起來。
     三張小圖連起來是同一個故事：裂縫 → 十字架架在裂縫上 → 對面那扇門開著。 */
  .quest { flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 0; margin-top: min(calc(14px * var(--u)), 2vh); }
  /* 三格一樣寬 —— 寬度讓標題排得下一行，不要變成「罪使我們與父隔／絕」 */
  .qnode { position: relative; flex: 1 1 0; min-width: 0; text-align: center;
    background: var(--surface); border: 4px solid var(--edge); box-shadow: 7px 7px 0 var(--hard);
    padding: min(calc(20px * var(--u)), 2.8vh) calc(14px * var(--u)) min(calc(16px * var(--u)), 2.2vh); }
  .qnode img { display: block; margin: 0 auto min(calc(10px * var(--u)), 1.4vh);
    width: min(calc(168px * var(--u)), 21vh); height: auto; image-rendering: pixelated; }
  /* 關卡編號：像 RPG 地圖上那顆圓點 */
  .qnode .qno { position: absolute; top: calc(-16px * var(--u)); left: 50%; transform: translateX(-50%);
    font-family: var(--pixel); font-size: calc(16px * var(--u)); line-height: 1;
    padding: calc(6px * var(--u)) calc(11px * var(--u));
    background: var(--root-c); color: var(--surface); border: 3px solid var(--edge); }
  .qnode b { display: block; font-size: min(calc(25px * var(--u)), 3.4vh); line-height: 1.45; }
  .qnode i { display: block; margin-top: calc(6px * var(--u)); font-style: normal;
    font-size: min(calc(17px * var(--u)), 2.3vh); color: var(--gold); }
  /* 連起來的路：一格一格的點，走過去的那種 */
  .qroad { flex: 0 0 calc(34px * var(--u)); height: 8px;
    background: repeating-linear-gradient(to right,
      var(--root-c) 0 8px, transparent 8px 16px); }

  .afterhd { display: flex; align-items: baseline; gap: calc(28px * var(--u)); flex-wrap: wrap; }
  .afterhd .stat { font-family: var(--pixel); font-size: min(calc(34px * var(--u)), 4.4vh); line-height: 1; }
  .afterhd .stat > span { font-family: var(--sans); font-weight: 700; font-size: calc(14px * var(--u));
    color: var(--ink-3); margin-right: 8px; }
  .afterhd .stat.up { color: var(--root-c); }

  /* 救恩之路：一道階梯從上面降下來，接到地面 */
  .stair { flex: 1; display: flex; align-items: center; justify-content: center; }
  .stair span { display: inline-block; padding: calc(14px * var(--u)) calc(30px * var(--u));
    border: 4px solid var(--root-c); background: var(--root-soft); color: var(--root-c);
    font-size: min(calc(34px * var(--u)), 4.4vh); font-weight: 900; letter-spacing: .12em;
    box-shadow: 6px 6px 0 var(--hard);
    animation: descend .9s ease-out; }
  @keyframes descend { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .cols3.way .col3 h3 { color: var(--root-c); font-size: calc(26px * var(--u)); }
  .cols3.way .col3 p { margin: 8px 0 0; font-size: min(calc(17px * var(--u)), 2.4vh);
    line-height: 1.8; color: var(--ink-2); }

  /* 耶穌代替我們償還罪債 */
  .cross { text-align: center; font-size: min(calc(120px * var(--u)), 16vh); color: var(--vol); line-height: 1.1;
    margin: min(calc(10px * var(--u)), 1.4vh) 0; }
  .paidline { text-align: center; font-size: min(calc(28px * var(--u)), 3.8vh); font-weight: 900;
    max-width: 26em; margin: 0 auto; }
  .plus { text-align: center; margin-top: min(calc(16px * var(--u)), 2.2vh);
    font-family: var(--pixel); font-size: min(calc(38px * var(--u)), 5vh); color: var(--root-c); }

  /* 信而受洗。這一頁不做任何回應動作 —— 收尾句是「今天你不用做任何決定」。 */
  .baplist { margin-top: min(calc(16px * var(--u)), 2.2vh); }
  .baplist p { margin: 0 0 min(calc(12px * var(--u)), 1.6vh);
    font-size: min(calc(26px * var(--u)), 3.6vh); font-weight: 700; line-height: 1.7; }
  .close { margin-top: auto; padding-top: min(calc(14px * var(--u)), 2vh);
    font-size: min(calc(40px * var(--u)), 5.4vh); font-weight: 900; color: var(--root-c); letter-spacing: .06em; }

  /* 排行／投票長條 */
  .opts { display: grid; gap: min(calc(9px * var(--u)), 1.4vh); margin-top: min(calc(14px * var(--u)), 2vh); max-width: 74ch; }
  .opt { display: flex; align-items: center; gap: 12px; }
  .opt .lbl { width: calc(150px * var(--u)); font-size: calc(19px * var(--u)); font-weight: 700; }
  .opt .track { flex: 1; height: min(calc(26px * var(--u)), 4vh); border: 3px solid var(--edge); background: var(--surface-2); }
  .opt .track i { display: block; height: 100%; background: var(--vol); transition: width .3s;
    -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px);
    mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px); }
  .opt .n { font-family: var(--pixel); font-size: calc(15px * var(--u)); color: var(--ink-2); width: calc(52px * var(--u)); text-align: right; }

  /* 天堂和地獄：誰投了哪一個。名字接在那一條長條底下。 */
  .opts.vote .votewho { margin: calc(2px * var(--u)) 0 calc(6px * var(--u)) calc(162px * var(--u));
    font-size: min(calc(16px * var(--u)), 2.2vh); font-weight: 700; color: var(--ink-3); }

  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 18px; }
  .col3 { background: var(--surface); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard); padding: min(18px, 2.4vh) 18px; }
  .col3 h3 { display: flex; align-items: baseline; gap: 10px; font-size: calc(22px * var(--u)); margin-bottom: 8px; }
  .col3 h3.next { font-size: calc(26px * var(--u)); }
  .col3 .who { font-size: calc(28px * var(--u)); font-weight: 900; display: block; margin: 0; }
  .col3 .delta { margin: calc(6px * var(--u)) 0 0; font-family: var(--pixel);
    font-size: calc(15px * var(--u)); color: var(--ink-3); }
  .col3 .delta b { margin-left: 10px; font-size: calc(17px * var(--u)); }
  .nextbox { margin-top: calc(16px * var(--u)); }

  /* 經文。用 em 限行長：ch 在中文字體上量的是數字寬度，會把整段擠成一條 */
  .verse { margin-top: calc(10px * var(--u)); }
  .verse blockquote { font-size: min(calc(44px * var(--u)), 4.8vh); font-weight: 900; line-height: 1.6;
    margin: 18px 0 0; max-width: 20em; }
  .verse .ref { font-family: var(--pixel); color: var(--gold); font-size: calc(20px * var(--u)); }
  .verse blockquote .ref { display: block; margin-top: calc(14px * var(--u)); }
  /* 回收上一關那一句：**不准斷行**。
     一斷行最後那兩個字會自己掉到第二行，念起來就散了 ——
     所以這一句不吃 max-width，改成一行到底，字級跟著版面寬度縮。 */
  .verse.back blockquote { max-width: none; white-space: nowrap;
    font-size: min(calc(40px * var(--u)), 4.6vh, 2.7vw); }
  .verse.back blockquote .ref { white-space: normal; }
  /* 救恩之路那一頁：還沒點到的後半句先淡著 */
  .verse.half blockquote .on { color: var(--root-c); }
  .verse.half blockquote .off { color: var(--ink-3); opacity: .45; }

  .note { background: var(--surface); border: 3px solid var(--edge); border-left-width: 10px; border-left-color: var(--gold);
    padding: 14px 16px; margin-top: calc(16px * var(--u)); max-width: 70ch; font-size: calc(14px * var(--u)); color: var(--ink-2); box-shadow: 5px 5px 0 var(--hard); }
  .note b { color: var(--ink); }

  /* HUD 控制列：固定深底淺字，不隨主題翻轉 */
  .controls { display: flex; gap: 10px; align-items: center; padding: 12px 20px;
    background: var(--bar-bg); border-top: 4px solid var(--bar-edge); flex-wrap: wrap; }
  .controls .btn { padding: 9px 14px; font-size: calc(13px * var(--u)); background: #1D2A2C; border: 3px solid var(--bar-edge);
    color: var(--bar-ink); box-shadow: 3px 3px 0 #000; }
  .controls .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .controls .btn.primary { background: var(--root-c); border-color: #9CF0D6; color: var(--on-primary); }
  .controls select { background: #1D2A2C; color: var(--bar-ink); border: 3px solid var(--bar-edge);
    padding: 9px 10px; font-family: var(--sans); font-weight: 700; font-size: calc(13px * var(--u)); }
  .controls .sp { flex: 1; }
  .controls .hint { color: #8FA8A1; font-size: calc(13px * var(--u)); font-family: var(--pixel); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1><a href="/happiness/zh-TW/" id="home" title="回系列頁">幸福模擬器</a> · 第三關 <b>萬世巨星</b></h1>
    <span class="tag" id="ptag">入場</span>
    <span class="spacer"></span>
    <button class="notesbtn" id="notesbtn" title="用手機掃，備忘錄會跟著大螢幕走">📱 主持人備忘錄</button>
    <button class="themebtn" data-theme-toggle></button>
    <span class="count" id="pcount">0 人在場</span>
  </div>

  <div class="body">
    <aside class="side">
      <h4>玩家狀態</h4>
      <div id="plist"></div>
    </aside>
    <main class="stage" id="stage"></main>
  </div>

  <div class="controls">
    <button class="btn" data-cmd="prev">← 上一頁</button>
    <button class="btn primary" data-cmd="next">下一頁 →</button>
    <select id="jump"></select>
    <!-- 每一頁該有的控制鈕。照第一關拍賣控制列的做法 —— 現場不要靠鍵盤。 -->
    <span id="mapctl" style="display:none;gap:8px;">
      <button class="btn" data-cmd="forkPrev" id="fprev">← 上一個岔路</button>
      <button class="btn primary" data-cmd="forkStep" id="fstep">公布結果</button>
    </span>
    <span id="quizctl" style="display:none;gap:8px;">
      <button class="btn" data-cmd="quizPrev" id="qprev">← 上一題</button>
      <button class="btn primary" data-cmd="quizStep" id="qstep">揭曉答案</button>
    </span>
    <span class="sp"></span>
    <span class="hint" id="hint"></span>
    <button class="btn" data-cmd="reset" id="resetbtn">全部重置</button>
  </div>
</div>

<!-- 主持人備忘錄的 QR：按 N 叫出來，平常收著 -->
<div class="notesqr" id="notesqr">
  <canvas id="notesqrc"></canvas>
  <div class="t">
    <h3>主持人備忘錄</h3>
    <p>用你自己的手機掃。這一頁會跟著大螢幕走，每一頁該念什麼、該做什麼、不要做什麼都在上面，也可以直接翻頁。</p>
    <div class="u" id="notesurl"></div>
    <div class="esc">再按一次 N 或 Esc 收起來</div>
  </div>
</div>

<script src="/happiness/shared/qr.js"></script>
<script src="/happiness/shared/room-client.js"></script>
<script src="/happiness/shared/stage-parts.js"></script>
<script src="/happiness/w3/host.js"></script>
</body>
</html>
