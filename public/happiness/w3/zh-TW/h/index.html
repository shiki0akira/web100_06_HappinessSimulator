<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/happiness/shared/logo.svg">
<title>主持人備忘錄 · 第3關 萬世巨星</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/happiness/shared/pixel.css">
<script src="/happiness/shared/theme.js"></script>
<link rel="stylesheet" href="/happiness/shared/notes.css">
</head>
<body>
<div class="app" id="app">
  <div class="hd">
    <div class="wk" id="wk">—</div>
    <div class="row"><span class="tag" id="tag">—</span><span class="pos" id="pos"></span><button class="themebtn" data-theme-toggle></button></div>
    <h2 id="title">連線中…</h2>
    <div class="live" id="live"></div>
  </div>
  <div class="body" id="body"></div>
  <!-- 猜句子那一頁才出現：一題一題揭答案，主持人拿著手機也控得動 -->
  <div class="auc" id="quizctl" hidden>
    <button id="quizprev">← 上一題</button>
    <button id="quizstep">揭曉答案</button>
  </div>
  <!-- 三條路那一頁才出現：大家選完再按開始爬 -->
  <div class="auc" id="climbctl" hidden>
    <button id="climbbtn">開始爬</button>
  </div>
  <!-- 救恩之路那一頁才出現：一段一段點出來 -->
  <div class="auc" id="wayctl" hidden>
    <button id="waystep">下一段</button>
  </div>
  <div class="ft">
    <button id="prev">←</button>
    <button class="next" id="next"><small>下一頁</small><span id="nextlbl"></span></button>
  </div>
</div>

<script src="/happiness/shared/room-client.js"></script>
<script src="/happiness/w3/notes.js"></script>
<script src="/happiness/shared/notes-page.js"></script>
</body>
</html>
