<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/happiness/shared/logo.svg">
<title>主持人備忘錄 · 第2關 真相大白</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/happiness/shared/pixel.css">
<script src="/happiness/shared/theme.js"></script>
<link rel="stylesheet" href="/happiness/shared/notes.css">
</head>
<body>
<div class="app" id="app">
  <div class="hd">
    <div class="wk" id="wk">—</div>
    <div class="row"><span class="tag" id="tag">—</span><span class="pos" id="pos"></span><button class="themebtn" data-theme-toggle></button></div>
    <h2 id="title">連線中…</h2>
    <div class="live" id="live"></div>
  </div>
  <div class="body" id="body"></div>
  <!-- 拍賣中才出現：大螢幕底下那排控制鈕 -->
  <div class="auc" id="auction" hidden>
    <button id="prevlot">← 上一項</button>
    <button id="nextlot">立即開標</button>
    <button id="extend">+15 秒</button>
    <button id="waitbtn">每項之間等我：關</button>
    <button id="restart">重跑拍賣</button>
  </div>
  <!-- 折舊揭曉中才出現：一項一項開，主持人拿著手機也控得動 -->
  <div class="auc" id="depctl" hidden>
    <button id="nextitem">揭曉下一項 →</button>
    <button id="revealall">全部開完</button>
    <button id="resetreveal">重跑折舊</button>
  </div>
  <div class="ft">
    <button id="prev">←</button>
    <button class="next" id="next"><small>下一頁</small><span id="nextlbl"></span></button>
  </div>
</div>

<script src="/happiness/shared/room-client.js"></script>
<script src="/happiness/w2/notes.js"></script>
<script src="/happiness/shared/notes-page.js"></script>
</body>
</html>
