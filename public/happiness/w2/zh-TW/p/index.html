<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/happiness/shared/logo.svg">
<title>幸福模擬器 · 真相大白</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/happiness/shared/pixel.css">
<script src="/happiness/shared/theme.js"></script>
<style>
  body { padding: 0 0 28px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

  .status { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 4px solid var(--edge); padding: 10px 16px 12px; }
  .status .row1 { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-3); }
  .status .row1 b { color: var(--ink); font-size: 20px; font-weight: 900; }
  .gauge { margin-top: 9px; }
  .gauge .lbl { display: flex; justify-content: space-between; font-family: var(--pixel); font-size: 13px; color: var(--ink-3); margin-bottom: 4px; }
  .gauge .lbl b { font-size: 13px; color: var(--vol); }
  .gauge + .gauge { margin-top: 7px; }
  .gauge + .gauge .lbl b { color: var(--root-c); }

  .screen { padding-top: 22px; }
  .screen h2 { font-size: 28px; font-weight: 900; letter-spacing: .03em; }
  .screen p { color: var(--ink-2); font-size: 18px; }
  .wait { text-align: center; padding: 44px 0; color: var(--ink-3); }
  .wait .dot { font-family: var(--pixel); font-size: 27px; letter-spacing: .3em; color: var(--root-c); }

  .slider { margin: 26px 0 10px; }
  .slider .val { font-family: var(--pixel); font-size: 51px; text-align: center; line-height: 1.2; }
  .ends { display: flex; justify-content: space-between; font-family: var(--pixel); font-size: 13px; color: var(--ink-3); margin-top: 8px; }

  .fullbtn { width: 100%; margin-top: 20px; padding: 18px; font-size: 21px; }
  .numin { width: 100%; padding: 16px; font-size: 40px; font-weight: 700; text-align: center;
    letter-spacing: .1em; font-family: var(--pixel); }

  /* 接關那兩格 */
  .screen p .sub { font-size: 16px; color: var(--ink-3); line-height: 1.7; font-weight: 500; }
  .fieldlbl { margin: 22px 0 8px; font-size: 19px; font-weight: 900; color: var(--ink); }
  .fieldlbl .sub { display: block; }

  /* 幸福人生商店 */
  .deal { margin-top: 14px; padding: 10px 14px; border: 3px dashed var(--gold); color: var(--gold);
    font-size: 19px; font-weight: 900; letter-spacing: .06em; }
  .deal small { font-family: var(--sans); font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
  .lotgrid { display: grid; gap: 9px; margin-top: 16px; }
  .lotchk { display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border: 3px solid var(--edge); background: var(--surface); font-size: 18px; font-weight: 700;
    box-shadow: 3px 3px 0 var(--hard); cursor: pointer; }
  .lotchk.on { border-color: var(--vol); background: #3A1E14; color: var(--vol); }
  .lotchk .box { width: 24px; height: 24px; border: 3px solid currentColor; flex: none; }
  .lotchk.on .box { background: var(--vol); }
  /* 圖示墊一塊深色底：有幾張圖本來就是淺色的，白底的淺色主題會整張消失 */
  .lotchk .chkart { width: 32px; height: 32px; flex: none; image-rendering: pixelated;
    background: #12211E; padding: 3px; }
  /* 挑滿三樣之後，其他的暗下來 —— 不禁用，按了還是可以先取消一樣 */
  .lotchk.off { opacity: .42; }
  .lotchk .sub { display: block; margin-top: 2px; font-size: 14px; font-weight: 500; color: var(--ink-3); }
  /* 買三送一的那一格：挑滿三樣它就亮起來，但要到最後才知道是什麼 */
  .lotchk.gift { border-style: dashed; border-color: var(--gold); color: var(--gold); cursor: default; }
  .lotchk.gift .box { border: 0; font-family: var(--pixel); font-size: 22px; text-align: center; line-height: 24px; }
  .lotchk.gift.on { background: #3A2E12; }

  /* 他的袋子：接下來每一頁的小看板 */
  .mine { display: grid; gap: 8px; margin-top: 16px; }
  .mrow { display: flex; align-items: center; gap: 12px; padding: 9px 12px;
    border: 3px solid var(--edge-soft); background: var(--surface); }
  .mrow img { width: 30px; height: 30px; flex: none; image-rendering: pixelated; opacity: .55;
    background: #12211E; padding: 3px; }
  .mrow .gicon { width: 36px; flex: none; text-align: center; font-family: var(--pixel); font-size: 20px; color: var(--gold); }
  .mrow .nm { font-size: 17px; font-weight: 700; color: var(--ink-2); }
  .mrow .v { margin-left: auto; font-family: var(--pixel); font-size: 15px; color: var(--ink-3); }
  .mrow.open { border-color: var(--vol); }
  .mrow.open img { opacity: 1; }
  .mrow.open .nm { color: var(--ink); }
  .mrow.open .v { color: var(--vol); }
  .mrow.gift { border-color: var(--gold); }
  .mrow.gift .nm, .mrow.gift .v { color: var(--gold); }
  .mine.big .mrow { padding: 13px 14px; }
  .mine.big .mrow img { width: 40px; height: 40px; }
  .mine.big .mrow .nm { font-size: 20px; color: var(--ink); }

  .hit { margin-top: 16px; padding: 14px; border: 3px dashed var(--vol); color: var(--vol);
    font-family: var(--pixel); font-size: 22px; text-align: center; }
  .hit.up { border-color: var(--root-c); color: var(--root-c); }

  /* 世界越來越進步，但人卻越來越痛苦 */
  .claim { font-size: 26px; font-weight: 900; line-height: 1.6; }

  /* 人生時光機 */
  .yr { font-family: var(--pixel); font-size: 56px; color: var(--gold); text-align: center; margin: 24px 0 8px; }

  .eternal { text-align: center; }
  .eternal .chest { display: block; margin: 0 auto 10px; width: 88px; image-rendering: pixelated; }
  .eternal .nm { font-size: 54px; font-weight: 900; color: var(--root-c); letter-spacing: .08em; }
  .eternal .rate { font-family: var(--pixel); font-size: 30px; color: var(--root-c); margin-top: 10px; }
  .wantbtn { width: 100%; margin-top: 22px; padding: 26px; font-size: 28px; font-weight: 900; letter-spacing: .2em; }

  .verse-p { text-align: center; padding: 10px 0; }
  .verse-p .ref { font-family: var(--pixel); font-size: 13px; color: var(--gold); }
  .verse-p blockquote { font-size: 26px; font-weight: 700; line-height: 1.95; margin: 16px 0 0; letter-spacing: .02em; }
  /* 兩頁經文都印整節：要念的那一半有顏色，還沒講到的那一半淡下去 */
  .verse-p.half blockquote .on { color: var(--vol); }
  .verse-p.half.second blockquote .on { color: var(--root-c); }
  .verse-p.half blockquote .off { color: var(--ink-3); opacity: .5; }

  textarea { width: 100%; min-height: 124px; padding: 14px; font-size: 21px; font-weight: 500; resize: vertical; }

  /* 領受／禱告之後那個「長出來了」的畫面 */
  .grew { display: flex; align-items: center; gap: 14px; margin-top: 22px;
    border: 3px solid var(--root-c); background: var(--root-soft); padding: 12px 14px; }
  .grew img { width: 96px; height: auto; image-rendering: pixelated; flex: none; }
  .grew p { margin: 0; font-size: 18px; line-height: 1.7; }
  .grew b { font-family: var(--pixel); font-size: 20px; }
  .privacy { margin-top: 12px; font-size: 16px; color: var(--ink-3); line-height: 1.8; }

  /* 卡片蓋在掃描線上面，存下來的圖才是乾淨的觀感 */
  .weekcard { width: 100%; border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard); display: block;
    margin-top: 16px; position: relative; z-index: 95; }
  .ok { color: var(--root-c); font-weight: 700; }
  .mono { font-family: var(--pixel); }
</style>
</head>
<body>
  <div class="status" id="status" hidden>
    <div class="row1"><b id="myname">—</b><span id="mystate"></span></div>
    <div class="gauge">
      <div class="lbl"><span>幸福指數</span><b id="outerv">—</b></div>
      <span class="bar"><i id="outerbar" style="width:0%;background:var(--vol)"></i></span>
    </div>
    <!-- 這一關的後段，這條線的標籤會從「？？？」變成「幸福根基」 -->
    <div class="gauge">
      <div class="lbl"><span id="innerlbl">？？？</span><b id="innerv">0</b></div>
      <span class="bar"><i id="innerbar" style="width:0%;background:var(--root-c)"></i></span>
    </div>
  </div>

  <div class="wrap"><div class="screen" id="screen"></div></div>

  <button class="themebtn floating" data-theme-toggle></button>

<script src="/happiness/shared/card.js"></script>
<script src="/happiness/shared/room-client.js"></script>
<script src="/happiness/w2/player.js"></script>
</body>
</html>
