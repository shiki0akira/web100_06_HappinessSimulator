<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/happiness/shared/logo.svg">
<title>幸福模擬器 · 第二關 真相大白 · 主畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/happiness/shared/pixel.css">
<script src="/happiness/shared/theme.js"></script>
<style>
  /* 主畫面會用 HDMI 接 43–75 吋電視，觀看距離 2–4 公尺。
     字級隨畫面寬度整體放大，--u 是縮放係數。 */
  :root { --u: 1; }
  @media (min-width: 1500px) { :root { --u: 1.22; } }
  @media (min-width: 1900px) { :root { --u: 1.5; } }
  @media (min-width: 2560px) { :root { --u: 2; } }

  body { overflow: hidden; }
  .app { display: grid; grid-template-rows: auto 1fr auto auto; height: 100vh; }

  .top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; border-bottom: 4px solid var(--edge); background: var(--surface);
  }
  .top h1 { font-size: calc(19px * var(--u)); font-weight: 900; }
  /* 回系列頁。現場有人在的時候會先問一句 —— 誤點再按「開場」會開到新房號 */
  .top h1 a { color: inherit; text-decoration: none; border-bottom: 3px solid transparent; }
  .top h1 a:hover, .top h1 a:focus-visible { color: var(--root-c); border-bottom-color: var(--root-c); }
  .top .spacer { flex: 1; }
  .top .count { font-family: var(--pixel); font-size: calc(15px * var(--u)); color: var(--ink-2); }
  /* 主持人備忘錄。放在頂端列，因為那是主持人的區域，而且一定看得到。 */
  .notesbtn { font-family: var(--sans); font-size: calc(13px * var(--u)); font-weight: 700;
    padding: calc(7px * var(--u)) calc(12px * var(--u));
    border: 3px solid var(--gold); background: transparent; color: var(--gold); }
  .notesbtn:hover { background: var(--gold); color: var(--surface); }
  .top .themebtn { font-size: calc(13px * var(--u)); padding: calc(7px * var(--u)) calc(10px * var(--u)); }

  .body { display: grid; grid-template-columns: calc(272px * var(--u)) 1fr; min-height: 0; }

  .side { border-right: 4px solid var(--edge); background: var(--surface); overflow-y: auto; padding: calc(10px * var(--u)); }
  .side h4 { font-family: var(--pixel); font-size: calc(15px * var(--u)); letter-spacing: .06em; color: var(--ink-3); margin: 0 0 calc(8px * var(--u)); text-transform: uppercase; }
  /* 一個人三到四行：名字（含標籤）＋兩條槽＋他挑的東西。八個人也要不捲動就看得完。 */
  .prow { padding: calc(5px * var(--u)) 0; border-bottom: 2px dashed var(--edge-soft); }
  .prow .nm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.25;
    font-size: calc(14px * var(--u)); font-weight: 700; }
  .prow .nm .drop { font-family: var(--pixel); font-size: calc(13px * var(--u)); color: var(--vol); }
  /* 行高要壓下來：body 的 1.7 會讓每個人多吃掉快五十像素，八個人就放不下了 */
  .prow .g { display: flex; align-items: center; gap: 8px; margin-top: calc(3px * var(--u)); line-height: 1.15;
    font-family: var(--pixel); font-size: calc(13px * var(--u)); color: var(--ink-3); }
  .prow .g .lbl { flex: none; width: 4.4em; }
  .prow .g .bar { flex: 1; min-width: 0; height: calc(10px * var(--u)); }
  .prow .g b { flex: none; width: 2.6em; text-align: right; font-size: calc(14px * var(--u)); }
  .prow .meta { display: flex; gap: 6px; align-items: center; margin-top: calc(3px * var(--u)); line-height: 1.2;
    font-size: calc(13px * var(--u)); color: var(--ink-3); font-family: var(--pixel); }
  .prow .meta.keep { display: block; font-family: var(--sans); font-weight: 700; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-family: var(--sans); font-size: calc(13px * var(--u)); font-weight: 700; padding: 1px 6px; border: 2px solid var(--edge-soft); background: var(--surface-2); color: var(--ink-2); }
  .chip.on { border-color: var(--root-c); background: var(--root-soft); color: var(--root-c); }
  .chip.want { border-color: var(--gold); background: #3A2E12; color: var(--gold); }

  /* 每一頁都要在一個畫面裡看完 —— overflow 只是保險，不是排版手段 */
  .stage { padding: calc(22px * var(--u)) calc(40px * var(--u)); overflow-y: auto; display: flex; flex-direction: column; }
  /* 幾個大塊都用 vh 封頂：視窗矮的時候自己縮，不會把下面的東西擠出畫面 */
  .stage h2 { font-size: min(calc(40px * var(--u)), 5.6vh); font-weight: 900; letter-spacing: .02em; }
  /* 大螢幕上的小標。共用樣式是照手機訂的，這裡整個放大一級，
     不然 2–4 公尺外只看得到一排灰灰的東西。 */
  .stage .kicker, .col3 .kicker { font-size: calc(20px * var(--u)); color: var(--ink-2); margin-bottom: 10px; }
  .stage .lede { font-size: calc(17px * var(--u)); color: var(--ink-2); max-width: 62ch; margin: 10px 0 0; }
  .big { font-size: min(calc(76px * var(--u)), 10vh); font-family: var(--pixel); line-height: 1.1; }
  .mono { font-family: var(--pixel); }
  .muted { color: var(--ink-3); }

  /* 共用元件（領受經文／祝福禱告）：插圖擺在計數旁邊 */
  .receive { display: flex; align-items: center; gap: calc(24px * var(--u)); margin-top: calc(22px * var(--u)); }
  .receive .stageart { margin: 0; }
  .receive .stageart img { width: min(calc(200px * var(--u)), 22vh); }
  .counter { margin-top: calc(18px * var(--u)); }
  .receive .counter { margin-top: 0; }

  .qrbox { display: flex; gap: 34px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
  .qrbox > div { flex: 1 1 280px; min-width: 0; }
  /* 不設 width：canvas 用點陣的原尺寸 1:1 顯示，模組邊緣才不會被縮放糊掉。
     大小改由 host.js 依 --u 算出每個模組幾像素。 */
  .qrbox canvas { border: 4px solid var(--edge); background: #fff; padding: 6px;
    image-rendering: pixelated;
    box-shadow: 8px 8px 0 var(--hard); position: relative; z-index: 95; }
  .roomcode { font-family: var(--pixel); font-size: calc(64px * var(--u)); color: var(--gold); letter-spacing: .14em; margin-top: 8px; }
  .url { font-family: var(--pixel); font-size: calc(24px * var(--u)); line-height: 1.8; color: var(--root-c); word-break: break-all; }
  .names { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .names span { padding: 6px 12px; background: var(--surface); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--hard); font-size: calc(15px * var(--u)); font-weight: 700; }

  /* 幸福人生商店的貨架：十一樣 ＋ 買三送一的那一格 ＝ 十二格，四欄三列，每格一樣大 */
  .board { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr;
    gap: min(calc(10px * var(--u)), 1.6vh); margin-top: min(calc(14px * var(--u)), 2vh); }
  .tile { display: flex; align-items: center; gap: calc(10px * var(--u));
    background: var(--surface); border: 4px solid var(--edge); box-shadow: 5px 5px 0 var(--hard);
    padding: min(calc(7px * var(--u)), 1.1vh) calc(10px * var(--u)); }
  .tile .txt { min-width: 0; }
  .tile .nm { display: flex; align-items: baseline; gap: 8px; font-size: min(calc(16px * var(--u)), 2.7vh); font-weight: 700; line-height: 1.3; }
  /* 牌的正面：剛剛誰挑了它。翻開之前那是這張牌上唯一的字。 */
  .tile .by { display: block; margin-top: 3px; font-size: min(calc(14px * var(--u)), 2.2vh);
    font-weight: 700; line-height: 1.5; color: var(--vol); }
  .tile .by.none { color: var(--ink-3); font-weight: 500; }
  /* 翻開前後一樣大：先把牌的高度定死，翻開之後版面才不會跳 */
  .board.flip .tile { min-height: min(calc(106px * var(--u)), 14.7vh); }
  .tile.face { cursor: pointer; border-color: var(--gold); }
  .tile.face:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--hard); }
  .tile.face:active { transform: translate(2px, 2px); box-shadow: none; }
  .afterhd .flipcount { font-family: var(--pixel); font-size: calc(14px * var(--u)); color: var(--ink-3); }
  /* 三十年後每一格的「為什麼」。那句話才是他們會記住的東西，百分比只是引子。 */
  .tile .why { display: block; margin-top: 3px; font-size: min(calc(13px * var(--u)), 2vh);
    font-weight: 500; line-height: 1.55; color: var(--ink-3); }
  .tile .sub { display: block; margin-top: 2px; font-size: min(calc(13px * var(--u)), 2.2vh); font-weight: 500; color: var(--ink-3); }
  .tile .left { margin-left: auto; white-space: nowrap; font-family: var(--pixel); font-size: min(calc(15px * var(--u)), 2.4vh); color: var(--vol); }
  /* 圖示墊一塊深色底：有幾張圖本來就是淺色的，白底的淺色主題會整張消失 */
  .tileart { width: min(calc(40px * var(--u)), 6vh); height: auto; flex: none; image-rendering: pixelated;
    background: #12211E; padding: calc(3px * var(--u)); }
  .tile.aged { border-color: var(--edge-soft); align-items: flex-start; }
  .tile.aged .tileart { margin-top: 2px; }
  .tile.aged .tileart { opacity: .75; }
  /* 買三送一的那一格。挑滿三樣它就是你的了 —— 只是還不知道是什麼 */
  .tile.gift { border-style: dashed; border-color: var(--gold); }
  .tile.gift .nm { color: var(--gold); }
  .tile.gift .q { flex: none; box-sizing: content-box;
    width: min(calc(40px * var(--u)), 6vh); height: min(calc(40px * var(--u)), 6vh); padding: calc(3px * var(--u));
    font-family: var(--pixel); font-size: min(calc(24px * var(--u)), 3.6vh); color: var(--gold);
    display: flex; align-items: center; justify-content: center; }
  .tile.gift.open { border-style: solid; border-color: var(--root-c); }
  .tile.gift.open .nm, .tile.gift.open .q { color: var(--root-c); }
  .tile.gift.open .left { color: var(--root-c); }

  /* 排行長條（全場最多人挑的）和投票長條共用 */
  .opts { display: grid; gap: min(calc(9px * var(--u)), 1.4vh); margin-top: min(calc(14px * var(--u)), 2vh); max-width: 74ch; }
  .opt { display: flex; align-items: center; gap: 12px; }
  .opt .rank { flex: none; width: calc(26px * var(--u)); height: calc(26px * var(--u)); line-height: calc(26px * var(--u));
    text-align: center; font-family: var(--pixel); font-size: calc(14px * var(--u));
    border: 2px solid var(--edge-soft); color: var(--ink-3); }
  .opt .rank.top { border-color: var(--gold); color: var(--gold); }
  .opt .lbl { width: calc(150px * var(--u)); font-size: calc(19px * var(--u)); font-weight: 700; }
  .opt .track { flex: 1; height: min(calc(26px * var(--u)), 4vh); border: 3px solid var(--edge); background: var(--surface-2); }
  .opt .track i { display: block; height: 100%; background: var(--vol);
    -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px);
    mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px); }
  .opt .n { font-family: var(--pixel); font-size: calc(15px * var(--u)); color: var(--ink-2); width: calc(52px * var(--u)); text-align: right; }

  /* 每個人的袋子 */
  .keeplist { margin-top: 10px; border-top: 3px solid var(--edge-soft); }
  .keeprow { display: flex; align-items: baseline; gap: calc(16px * var(--u));
    padding: calc(7px * var(--u)) 0; border-bottom: 2px dashed var(--edge-soft); }
  .keeprow .nm { flex: none; width: calc(148px * var(--u)); font-size: calc(18px * var(--u)); font-weight: 700; }
  .keeprow .got { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
  .keeprow .lot { font-size: calc(15px * var(--u)); padding: 2px 9px;
    border: 2px solid var(--edge-soft); background: var(--surface); }
  .keeprow .lot.gift { border-color: var(--gold); color: var(--gold); }
  .keeprow .lot b { font-family: var(--pixel); font-size: calc(13px * var(--u)); color: var(--vol); margin-left: 4px; }
  .keeprow .none { font-size: calc(15px * var(--u)); color: var(--ink-3); }
  .keeprow .drop { flex: none; font-family: var(--pixel); font-size: calc(16px * var(--u)); color: var(--vol); }
  /* 人多的時候壓緊一點：十二個人也要在同一個畫面裡看得完 */
  .keeplist.dense .keeprow { padding: calc(4px * var(--u)) 0; }
  .keeplist.dense .nm { font-size: calc(15px * var(--u)); }
  .keeplist.dense .lot { font-size: calc(13px * var(--u)); padding: 1px 7px; }

  /* 三十年後那一頁：標題和全場的變化擠在同一行，版面留給十二格的「為什麼」 */
  .afterhd { display: flex; align-items: baseline; gap: calc(28px * var(--u)); flex-wrap: wrap; }
  .afterhd .stat { font-family: var(--pixel); font-size: min(calc(38px * var(--u)), 5vh); line-height: 1; }
  .afterhd .stat > span { font-family: var(--sans); font-weight: 700; font-size: calc(14px * var(--u));
    color: var(--ink-3); margin-right: 8px; }
  .afterhd .stat.drop { color: var(--vol); }

  /* 「世界越來越進步，但人卻越來越痛苦」 */
  .claim { font-size: min(calc(46px * var(--u)), 6.4vh); font-weight: 900; line-height: 1.5; max-width: 22em;
    margin-top: calc(10px * var(--u)); }
  .claim.small { font-size: min(calc(30px * var(--u)), 4.2vh); color: var(--ink-2); }

  /* 人生時光機 */
  .warp { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden; }
  .warp .rails { position: absolute; inset: 0; display: flex; justify-content: space-between; opacity: .5; }
  .warp .rails i { width: calc(6px * var(--u)); background: linear-gradient(var(--root-c), transparent);
    animation: rail 900ms linear infinite; }
  .warp .rails i:nth-child(2n) { animation-duration: 600ms; opacity: .6; }
  .warp .rails i:nth-child(3n) { animation-duration: 1300ms; opacity: .35; }
  @keyframes rail { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
  .warp .yr { font-family: var(--pixel); font-size: min(calc(130px * var(--u)), 18vh); color: var(--gold);
    line-height: 1; position: relative; }
  .warp .warplbl { margin-top: calc(16px * var(--u)); font-size: calc(24px * var(--u)); font-weight: 900;
    letter-spacing: .4em; color: var(--ink-2); position: relative; }

  /* 買三送一那一樣 */
  .giftline { font-size: min(calc(28px * var(--u)), 3.6vh); font-weight: 900; line-height: 1.5;
    text-align: center; max-width: 34em; margin: 0 auto; }
  /* 還沒打開的那一頁：一個標題，一個蓋著的寶箱 */
  .giftitle { text-align: center; }
  .chestbox { flex: 1; display: flex; align-items: center; justify-content: center; }
  .chest.shut { width: min(calc(240px * var(--u)), 34vh); cursor: pointer;
    animation: chestbob 2.4s ease-in-out infinite; }
  .chest.shut:hover { filter: brightness(1.15); }
  @keyframes chestbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .bless { text-align: center; font-size: min(calc(24px * var(--u)), 3.2vh); font-weight: 700;
    color: var(--root-c); margin: min(calc(10px * var(--u)), 1.4vh) auto 0; }

  /* 正名那一頁：每個人的第二條線 */
  .innerlist { display: flex; flex-wrap: wrap; gap: calc(10px * var(--u)); margin-top: calc(10px * var(--u)); }
  .innerlist span { display: flex; align-items: baseline; gap: 10px;
    padding: calc(7px * var(--u)) calc(14px * var(--u));
    border: 3px solid var(--root-c); background: var(--root-soft); box-shadow: 3px 3px 0 var(--hard); }
  .innerlist em { font-style: normal; font-size: calc(17px * var(--u)); font-weight: 700; color: var(--ink); }
  .innerlist b { font-family: var(--pixel); font-size: calc(20px * var(--u)); color: var(--root-c); }
  .eternal { text-align: center; margin: min(calc(14px * var(--u)), 1.8vh) 0; }
  .eternal .chest { display: block; margin: 0 auto min(calc(10px * var(--u)), 1.4vh);
    width: min(calc(80px * var(--u)), 9vh); image-rendering: pixelated; }
  .eternal .nm { font-size: min(calc(96px * var(--u)), 10vh); font-weight: 900; color: var(--root-c); letter-spacing: .1em; }
  .eternal .rate { font-family: var(--pixel); font-size: min(calc(48px * var(--u)), 4.6vh); color: var(--root-c); margin-top: 6px; }
  .wantlist { display: flex; flex-wrap: wrap; gap: 10px; margin-top: calc(14px * var(--u)); justify-content: center; }
  .wantlist span { padding: 8px 14px; background: var(--root-soft); border: 3px solid var(--root-c); color: var(--root-c);
    font-size: calc(17px * var(--u)); font-weight: 700; box-shadow: 3px 3px 0 var(--hard); }

  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 18px; }
  .col3 { background: var(--surface); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard); padding: min(18px, 2.4vh) 18px; }
  .col3 h3 { display: flex; align-items: baseline; gap: 10px; font-size: calc(22px * var(--u)); margin-bottom: 8px; }
  /* 下週預告：下一關的名字要比其他小標大一級 */
  .col3 h3.next { font-size: calc(26px * var(--u)); }
  .col3 .who { font-size: calc(28px * var(--u)); font-weight: 900; }
  /* 盜賊那一欄用橘紅，「我來了」那一欄用青 —— 兩欄的顏色就是今晚的兩個方向 */
  .col3.thief { border-left: 12px solid var(--vol); }
  .col3.thief h3 { color: var(--vol); }
  .col3.jesus { border-left: 12px solid var(--root-c); }
  .col3.jesus h3 { color: var(--root-c); }

  /* 經文。用 em 限行長：ch 在中文字體上量的是數字寬度，會把整段擠成一條 */
  .verse { margin-top: calc(10px * var(--u)); }
  .verse blockquote { font-size: min(calc(44px * var(--u)), 4.8vh); font-weight: 900; line-height: 1.6;
    margin: 18px 0 0; max-width: 20em; }
  .verse .ref { font-family: var(--pixel); color: var(--gold); font-size: calc(20px * var(--u)); }
  /* 兩頁經文都印整節：要念的那一半有顏色，還沒講到的那一半淡下去 */
  .verse.half blockquote .on { color: var(--vol); }
  .verse.half.second blockquote .on { color: var(--root-c); }
  .verse.half blockquote .off { color: var(--ink-3); opacity: .5; }

  .note { background: var(--surface); border: 3px solid var(--edge); border-left-width: 10px; border-left-color: var(--gold);
    padding: 14px 16px; margin-top: calc(16px * var(--u)); max-width: 70ch; font-size: calc(14px * var(--u)); color: var(--ink-2); box-shadow: 5px 5px 0 var(--hard); }
  .note b { color: var(--ink); }

  /* HUD 控制列：固定深底淺字，不隨主題翻轉 */
  .controls { display: flex; gap: 10px; align-items: center; padding: 12px 20px;
    background: var(--bar-bg); border-top: 4px solid var(--bar-edge); flex-wrap: wrap; }
  .controls .btn { padding: 9px 14px; font-size: calc(13px * var(--u)); background: #1D2A2C; border: 3px solid var(--bar-edge);
    color: var(--bar-ink); box-shadow: 3px 3px 0 #000; }
  .controls .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .controls .btn.primary { background: var(--root-c); border-color: #9CF0D6; color: var(--on-primary); }
  .controls select { background: #1D2A2C; color: var(--bar-ink); border: 3px solid var(--bar-edge);
    padding: 9px 10px; font-family: var(--sans); font-weight: 700; font-size: calc(13px * var(--u)); }
  .controls .sp { flex: 1; }
  .controls .hint { color: #8FA8A1; font-size: calc(13px * var(--u)); font-family: var(--pixel); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1><a href="/happiness/zh-TW/" id="home" title="回系列頁">幸福模擬器</a> · 第二關 <b>真相大白</b></h1>
    <span class="tag" id="ptag">入場</span>
    <span class="spacer"></span>
    <button class="notesbtn" id="notesbtn" title="用手機掃，備忘錄會跟著大螢幕走">📱 主持人備忘錄</button>
    <button class="themebtn" data-theme-toggle></button>
    <span class="count" id="pcount">0 人在場</span>
  </div>

  <div class="body">
    <aside class="side">
      <h4>玩家狀態</h4>
      <div id="plist"></div>
    </aside>
    <main class="stage" id="stage"></main>
  </div>

  <div class="controls">
    <button class="btn" data-cmd="prev">← 上一頁</button>
    <button class="btn primary" data-cmd="next">下一頁 →</button>
    <select id="jump"></select>
    <span class="sp"></span>
    <span class="hint" id="hint"></span>
    <button class="btn" data-cmd="reset" id="resetbtn">全部重置</button>
  </div>
</div>

<!-- 主持人備忘錄的 QR：按 N 叫出來，平常收著 -->
<div class="notesqr" id="notesqr">
  <canvas id="notesqrc"></canvas>
  <div class="t">
    <h3>主持人備忘錄</h3>
    <p>用你自己的手機掃。這一頁會跟著大螢幕走，每一頁該念什麼、該做什麼、不要做什麼都在上面，也可以直接翻頁。</p>
    <div class="u" id="notesurl"></div>
    <div class="esc">再按一次 N 或 Esc 收起來</div>
  </div>
</div>

<script src="/happiness/shared/qr.js"></script>
<script src="/happiness/shared/room-client.js"></script>
<script src="/happiness/shared/stage-parts.js"></script>
<script src="/happiness/w2/host.js"></script>
</body>
</html>
