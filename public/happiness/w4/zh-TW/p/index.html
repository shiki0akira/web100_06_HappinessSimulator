<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/happiness/shared/logo.svg">
<title>幸福模擬器 · 幸福連線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/happiness/shared/pixel.css">
<script src="/happiness/shared/theme.js"></script>
<style>
  body { padding: 0 0 28px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

  .status { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 4px solid var(--edge); padding: 10px 16px 12px; }
  .status .row1 { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-3); }
  .status .row1 b { color: var(--ink); font-size: 20px; font-weight: 900; }
  .gauge { margin-top: 9px; }
  .gauge .lbl { display: flex; justify-content: space-between; font-family: var(--pixel); font-size: 13px; color: var(--ink-3); margin-bottom: 4px; }
  .gauge .lbl b { font-size: 13px; color: var(--vol); }
  .gauge + .gauge { margin-top: 7px; }
  .gauge + .gauge .lbl b { color: var(--root-c); }

  .screen { padding-top: 22px; }
  .screen h2 { font-size: 28px; font-weight: 900; letter-spacing: .03em; }
  .screen p { color: var(--ink-2); font-size: 18px; }
  .wait { text-align: center; padding: 44px 0; color: var(--ink-3); }
  .wait .dot { font-family: var(--pixel); font-size: 27px; letter-spacing: .3em; color: var(--root-c); }

  .fullbtn { width: 100%; margin-top: 20px; padding: 18px; font-size: 21px; }
  .numin { width: 100%; padding: 16px; font-size: 40px; font-weight: 700; text-align: center;
    letter-spacing: .1em; font-family: var(--pixel); }

  /* 接關那兩格 */
  .screen p .sub { font-size: 16px; color: var(--ink-3); line-height: 1.7; font-weight: 500; }
  .fieldlbl { margin: 22px 0 8px; font-size: 19px; font-weight: 900; color: var(--ink); }
  .fieldlbl .sub { display: block; font-size: 15px; font-weight: 500; color: var(--ink-3); }

  .qn { font-family: var(--pixel); font-size: 14px; color: var(--gold); }
  /* 情境那一句是主角 —— 把人放進那個場景裡 */
  .when { font-size: 25px; font-weight: 900; line-height: 1.6; margin: 10px 0 2px; }
  .whensub { font-size: 17px; color: var(--ink-3); line-height: 1.7; }

  .lotgrid { display: grid; gap: 9px; margin-top: 16px; }
  .lotchk { display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border: 3px solid var(--edge); background: var(--surface); font-size: 18px; font-weight: 700;
    box-shadow: 3px 3px 0 var(--hard); cursor: pointer; }
  .lotchk.on { border-color: var(--vol); background: #3A1E14; color: var(--vol); }
  .lotchk .sub { display: block; margin-top: 3px; font-size: 14px; font-weight: 500; color: var(--ink-3); }
  /* 一排一個。**這一題是複選**，所以每一格左邊要有一個看得出來的方框 ——
     沒有方框全場會以為只能選一個。七格會超過一個畫面，那沒關係，手機本來就會捲。 */
  .lotgrid.lines { gap: 8px; }
  .lotchk.line { border-color: var(--gold); align-items: center; gap: 12px; padding: 10px 13px; }
  .lotchk.line .box { width: 24px; height: 24px; border: 3px solid currentColor; flex: none; }
  .lotchk.line.on .box { background: var(--vol); }
  .lotchk.line .t { min-width: 0; }
  .lotchk.line b { display: block; font-size: 19px; line-height: 1.3; }
  .lotchk.line i { display: block; font-style: normal; font-size: 13px; font-weight: 500;
    line-height: 1.4; color: var(--ink-3); margin-top: 2px; }
  .lotchk.line.on i { color: var(--vol); }
  /* 「其他」那一格勾起來才長出輸入框。**寫的東西會上大螢幕**，所以底下要講清楚。 */
  .otherbox { margin-top: 8px; }
  .otherbox input { width: 100%; padding: 12px 13px; font-size: 19px; font-weight: 700; }
  .otherbox .warn { margin-top: 6px; font-size: 14px; line-height: 1.6; color: var(--gold); }

  /* 那一頭回你什麼 */
  .reply { margin-top: 16px; padding: 18px; border: 3px solid var(--gold);
    font-size: 20px; font-weight: 700; line-height: 1.8; }
  .replyfrom { font-family: var(--pixel); font-size: 13px; color: var(--gold); }

  .hit { margin-top: 16px; padding: 14px; border: 3px dashed var(--vol); color: var(--vol);
    font-family: var(--pixel); font-size: 20px; text-align: center; }
  .hit.up { border-color: var(--root-c); color: var(--root-c); }

  /* 第三通：一顆大按鈕，一按就接 */
  .dialart { display: block; width: 48%; max-width: 170px; margin: 18px auto 0;
    image-rendering: pixelated; }
  .dialconds { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 14px; }
  .dialconds span { border: 3px solid var(--root-c); color: var(--root-c); padding: 4px 10px;
    font-size: 15px; font-weight: 700; }
  .dialknows { margin-top: 12px; text-align: center; font-size: 20px; font-weight: 900; }
  .connected { margin-top: 18px; padding: 20px; border: 3px solid var(--root-c);
    background: var(--root-soft); color: var(--root-c); text-align: center;
    font-family: var(--pixel); font-size: 34px; letter-spacing: .16em; }
  .halfverse { margin-top: 16px; text-align: center; font-size: 22px; font-weight: 900;
    line-height: 1.7; color: var(--gold); }

  /* 一起禱告的時候，手機上只有他自己寫的那一句 —— 那是他的稿子 */
  .myline { margin-top: 16px; padding: 18px; border: 3px solid var(--root-c);
    background: var(--root-soft); font-size: 21px; font-weight: 700; line-height: 1.8; }
  .myline .ask { display: block; font-size: 15px; font-weight: 500; color: var(--ink-3); margin-bottom: 8px; }
  .prayscript { margin-top: 18px; }
  .prayscript p { margin: 0 0 12px; font-size: 21px; font-weight: 700; line-height: 1.7; }
  .prayscript p.dim { color: var(--ink-3); font-weight: 500; font-size: 18px; }

  .closetext { margin-top: 16px; font-size: 19px; font-weight: 700; line-height: 1.9;
    border-left: 6px solid var(--root-c); padding-left: 14px; }

  /* 天父的回信。**手機上沒有按鈕** —— 那一封是全場一起拆的。 */
  .letterp { text-align: center; padding-top: 8px; animation: unsealp .5s ease-out; }
  @keyframes unsealp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .letterp img { display: block; width: 62%; max-width: 230px; margin: 0 auto 18px;
    image-rendering: pixelated; }
  .letterp blockquote { margin: 0; font-size: 27px; font-weight: 900; line-height: 1.7; color: var(--root-c); }
  .letterp .ref { display: block; margin-top: 12px; font-family: var(--pixel); font-size: 13px; color: var(--gold); }
  .letterp .from { display: block; margin-top: 18px; font-size: 20px; font-weight: 900; }

  .howlist { margin-top: 14px; }
  .howrow { padding: 11px 0; border-bottom: 2px dashed var(--edge-soft); }
  .howrow b { font-size: 20px; font-weight: 900; }
  .howrow span { display: block; margin-top: 3px; font-size: 16px; color: var(--ink-3); line-height: 1.6; }

  .verse-p { text-align: center; padding: 10px 0; }
  .verse-p .ref { font-family: var(--pixel); font-size: 13px; color: var(--gold); }
  .verse-p blockquote { font-size: 26px; font-weight: 700; line-height: 1.95; margin: 16px 0 0; letter-spacing: .02em; }

  textarea { width: 100%; min-height: 108px; padding: 14px; font-size: 21px; font-weight: 500; resize: vertical; }

  /* 領受／禱告之後那個「長出來了」的畫面 */
  .grew { display: flex; align-items: center; gap: 14px; margin-top: 22px;
    border: 3px solid var(--root-c); background: var(--root-soft); padding: 12px 14px; }
  .grew img { width: 96px; height: auto; image-rendering: pixelated; flex: none; }
  .grew p { margin: 0; font-size: 18px; line-height: 1.7; }
  .grew b { font-family: var(--pixel); font-size: 20px; }
  .privacy { margin-top: 12px; font-size: 16px; color: var(--ink-3); line-height: 1.8; }

  .weekcard { width: 100%; border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard); display: block;
    margin-top: 16px; position: relative; z-index: 95; }

  .ok { color: var(--root-c); font-weight: 700; }
  .mono { font-family: var(--pixel); }
</style>
</head>
<body>
  <div class="status" id="status" hidden>
    <div class="row1"><b id="myname">—</b><span id="mystate"></span></div>
    <div class="gauge">
      <div class="lbl"><span>幸福指數</span><b id="outerv">—</b></div>
      <span class="bar"><i id="outerbar" style="width:0%;background:var(--vol)"></i></span>
    </div>
    <div class="gauge">
      <div class="lbl"><span>幸福根基</span><b id="innerv">0</b></div>
      <span class="bar"><i id="innerbar" style="width:0%;background:var(--root-c)"></i></span>
    </div>
  </div>

  <div class="wrap"><div class="screen" id="screen"></div></div>

  <button class="themebtn floating" data-theme-toggle></button>

<script src="/happiness/shared/card.js"></script>
<script src="/happiness/shared/room-client.js"></script>
<script src="/happiness/w4/player.js"></script>
</body>
</html>
