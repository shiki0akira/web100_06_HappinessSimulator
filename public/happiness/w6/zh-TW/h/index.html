<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/happiness/shared/logo.svg">
<title>主持人備忘錄 · 第6關 十字架的勝利</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/happiness/shared/pixel.css">
<script src="/happiness/shared/theme.js"></script>
<link rel="stylesheet" href="/happiness/shared/notes.css">
</head>
<body>
<div class="app" id="app">
  <div class="hd">
    <div class="wk" id="wk">—</div>
    <div class="row"><span class="tag" id="tag">—</span><span class="pos" id="pos"></span><button class="themebtn" data-theme-toggle></button></div>
    <h2 id="title">連線中…</h2>
    <div class="live" id="live"></div>
  </div>
  <div class="body" id="body"></div>
  <!-- 三張困難卡那一頁才出現：大家挑完再公布（公布那一刻才扣分） -->
  <div class="auc" id="pickctl" hidden>
    <button id="pickreveal">公布結果</button>
  </div>
  <!-- 兩段打鬥那幾頁才出現：大家決定完再公布 -->
  <div class="auc" id="fightctl" hidden>
    <button id="fightprev">← 上一回合</button>
    <button id="fightstep">公布結果</button>
  </div>
  <!-- 十字架那一頁才出現：四段一段一段走 -->
  <div class="auc" id="crossctl" hidden>
    <button id="crossback">← 上一步</button>
    <button id="crossnext">下一步</button>
  </div>
  <!-- 最後一擊那一頁才出現：全場都出手了才倒下 -->
  <div class="auc" id="beatctl" hidden>
    <button id="beatall">全場出手</button>
  </div>
  <!-- 全場一起打贏那一頁才出現：翻開開場那張蓋著的卡 -->
  <div class="auc" id="goodctl" hidden>
    <button id="goodopen">翻開</button>
  </div>
  <div class="ft">
    <button id="prev">←</button>
    <button class="next" id="next"><small>下一頁</small><span id="nextlbl"></span></button>
  </div>
</div>

<script src="/happiness/shared/room-client.js"></script>
<script src="/happiness/w6/notes.js"></script>
<script src="/happiness/shared/notes-page.js"></script>
</body>
</html>
