<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/happiness/shared/logo.svg">
<title>幸福模擬器 · 第六關 十字架的勝利 · 主畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/happiness/shared/pixel.css">
<script src="/happiness/shared/theme.js"></script>
<style>
  /* 主畫面會用 HDMI 接 43–75 吋電視，觀看距離 2–4 公尺。
     字級隨畫面寬度整體放大，--u 是縮放係數。 */
  :root { --u: 1; }
  @media (min-width: 1500px) { :root { --u: 1.22; } }
  @media (min-width: 1900px) { :root { --u: 1.5; } }
  @media (min-width: 2560px) { :root { --u: 2; } }

  body { overflow: hidden; }
  .app { display: grid; grid-template-rows: auto 1fr auto auto; height: 100vh; }

  .top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; border-bottom: 4px solid var(--edge); background: var(--surface);
  }
  .top h1 { font-size: calc(19px * var(--u)); font-weight: 900; }
  .top h1 a { color: inherit; text-decoration: none; border-bottom: 3px solid transparent; }
  .top h1 a:hover, .top h1 a:focus-visible { color: var(--root-c); border-bottom-color: var(--root-c); }
  .top .spacer { flex: 1; }
  .top .count { font-family: var(--pixel); font-size: calc(15px * var(--u)); color: var(--ink-2); }
  .notesbtn { font-family: var(--sans); font-size: calc(13px * var(--u)); font-weight: 700;
    padding: calc(7px * var(--u)) calc(12px * var(--u));
    border: 3px solid var(--gold); background: transparent; color: var(--gold); }
  .notesbtn:hover { background: var(--gold); color: var(--surface); }
  .top .themebtn { font-size: calc(13px * var(--u)); padding: calc(7px * var(--u)) calc(10px * var(--u)); }

  .body { display: grid; grid-template-columns: calc(272px * var(--u)) 1fr; min-height: 0; }

  .side { border-right: 4px solid var(--edge); background: var(--surface); overflow-y: auto; padding: calc(10px * var(--u)); }
  .side h4 { font-family: var(--pixel); font-size: calc(15px * var(--u)); letter-spacing: .06em; color: var(--ink-3); margin: 0 0 calc(8px * var(--u)); text-transform: uppercase; }
  .prow { padding: calc(5px * var(--u)) 0; border-bottom: 2px dashed var(--edge-soft); }
  .prow .nm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.25;
    font-size: calc(14px * var(--u)); font-weight: 700; }
  .prow .g { display: flex; align-items: center; gap: 8px; margin-top: calc(3px * var(--u)); line-height: 1.15;
    font-family: var(--pixel); font-size: calc(13px * var(--u)); color: var(--ink-3); }
  .prow .g .lbl { flex: none; width: 4.4em; }
  .prow .g .bar { flex: 1; min-width: 0; height: calc(10px * var(--u)); }
  .prow .g b { flex: none; width: 2.6em; text-align: right; font-size: calc(14px * var(--u)); }
  .chip { font-family: var(--sans); font-size: calc(13px * var(--u)); font-weight: 700; padding: 1px 6px; border: 2px solid var(--edge-soft); background: var(--surface-2); color: var(--ink-2); }
  .chip.on { border-color: var(--root-c); background: var(--root-soft); color: var(--root-c); }
  /* 被打中的人：**不加紅色、不加「危險」**（架構第十一節） */
  .chip.hit { border-color: var(--gold); color: var(--gold); background: transparent; }

  /* 每一頁都要在一個畫面裡看完 —— overflow 只是保險，不是排版手段 */
  .stage { padding: calc(22px * var(--u)) calc(40px * var(--u)); overflow-y: auto; display: flex; flex-direction: column; }
  .stage h2 { font-size: min(calc(40px * var(--u)), 5.6vh); font-weight: 900; letter-spacing: .02em; }
  .stage .kicker, .col3 .kicker { font-size: calc(20px * var(--u)); color: var(--ink-2); margin-bottom: 10px; }
  .stage .lede { font-size: calc(17px * var(--u)); color: var(--ink-2); max-width: 62ch; margin: 10px 0 0; }
  .big { font-size: min(calc(76px * var(--u)), 10vh); font-family: var(--pixel); line-height: 1.1; }
  .mono { font-family: var(--pixel); }
  .muted { color: var(--ink-3); }

  .receive { display: flex; align-items: center; gap: calc(24px * var(--u)); margin-top: calc(22px * var(--u)); }
  .receive .stageart { margin: 0; }
  .receive .stageart img { width: min(calc(200px * var(--u)), 22vh); }
  .counter { margin-top: calc(18px * var(--u)); }
  .receive .counter { margin-top: 0; }

  .qrbox { display: flex; gap: 34px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
  .qrbox > div { flex: 1 1 280px; min-width: 0; }
  .qrbox canvas { border: 4px solid var(--edge); background: #fff; padding: 6px;
    image-rendering: pixelated; box-shadow: 8px 8px 0 var(--hard); position: relative; z-index: 95; }
  .roomcode { font-family: var(--pixel); font-size: calc(64px * var(--u)); color: var(--gold); letter-spacing: .14em; margin-top: 8px; }
  .url { font-family: var(--pixel); font-size: calc(24px * var(--u)); line-height: 1.8; color: var(--root-c); word-break: break-all; }
  .names { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .names span { padding: 6px 12px; background: var(--surface); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--hard); font-size: calc(15px * var(--u)); font-weight: 700; }

  /* 「幾人已…」是給主持人等人的一行小字，不是這一頁的主角 */
  .qcount { margin-top: calc(6px * var(--u)); font-family: var(--pixel);
    font-size: calc(15px * var(--u)); color: var(--ink-3); }
  .qcount.all { color: var(--root-c); }
  .qcount b { font-family: var(--sans); font-size: calc(15px * var(--u)); }

  /* ── 標題頁 ───────────────────────────────────────────────────────── */
  .teaser { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .teaser .big-title { font-size: min(calc(72px * var(--u)), 9vh, 6vw); letter-spacing: .12em; white-space: nowrap; }
  .teaseart img { display: block; width: min(calc(200px * var(--u)), 28vh); height: auto;
    image-rendering: pixelated; margin: min(calc(14px * var(--u)), 2vh) auto 0; }
  .teaser .teaseline { margin-top: min(calc(20px * var(--u)), 2.8vh);
    font-size: min(calc(30px * var(--u)), 3.8vh, 2.3vw); font-weight: 700;
    color: var(--ink-2); white-space: nowrap; }

  /* ── 整頁只有一句話（第 4 頁：我們追求的方向…）**不准斷行** ────────── */
  .solo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .solo h2 { font-size: min(calc(52px * var(--u)), 8vh, 3.3vw); line-height: 1.45;
    letter-spacing: .04em; white-space: nowrap; }

  /* ── 什麼才是「好」？兩欄，右邊蓋著 ───────────────────────────────── */
  .goodsub { margin-top: min(calc(6px * var(--u)), .8vh); font-size: min(calc(24px * var(--u)), 3vh);
    font-weight: 700; color: var(--ink-2); }
  .goodgrid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: calc(28px * var(--u));
    align-items: stretch; margin-top: min(calc(16px * var(--u)), 2.2vh); }
  .goodcol { display: flex; flex-direction: column; background: var(--surface);
    border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard);
    padding: min(calc(20px * var(--u)), 2.6vh) calc(28px * var(--u)); min-width: 0; }
  .goodcol h3 { font-size: min(calc(28px * var(--u)), 3.4vh); font-weight: 900; letter-spacing: .04em;
    padding-bottom: min(calc(10px * var(--u)), 1.2vh); border-bottom: 3px dashed var(--edge-soft); }
  .goodcol ul { list-style: none; margin: min(calc(14px * var(--u)), 1.8vh) 0 0; padding: 0;
    display: flex; flex-direction: column; justify-content: center; gap: min(calc(10px * var(--u)), 1.4vh); flex: 1; }
  .goodcol li { font-size: min(calc(30px * var(--u)), 3.8vh, 2vw); font-weight: 900; line-height: 1.4; }
  .goodcol li::before { content: '▍'; color: var(--vol); margin-right: .4em; }
  /* 右邊那一欄：翻開之前只有一個問號。**第 3 頁不准講出它是什麼。** */
  .goodcol.right { border-color: var(--gold); }
  .goodcol.right h3 { color: var(--gold); }
  .goodcol.right li::before { color: var(--root-c); }
  .goodcol.right li { font-size: min(calc(26px * var(--u)), 3.2vh, 1.8vw); }
  .goodq { flex: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--pixel); font-size: min(calc(150px * var(--u)), 22vh); color: var(--gold); }
  .goodcol.right.open { animation: unseal .6s ease-out; }

  /* ── 你現在扛的是哪一塊：六塊排三欄兩列 ───────────────────────────── */
  .aspectgrid { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr)); gap: calc(20px * var(--u));
    align-content: center; margin-top: min(calc(18px * var(--u)), 2.4vh); }
  .ac { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: min(calc(10px * var(--u)), 1.2vh); background: var(--surface);
    border: 4px solid var(--edge); box-shadow: 5px 5px 0 var(--hard);
    padding: min(calc(16px * var(--u)), 2vh) calc(18px * var(--u));
    font-size: min(calc(32px * var(--u)), 4vh, 2.2vw); font-weight: 900; letter-spacing: .06em; }
  .ac img { width: min(calc(72px * var(--u)), 8.5vh); height: auto; image-rendering: pixelated; }

  /* ── 三張困難卡 ───────────────────────────────────────────────────── */
  .cardgrid { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: calc(20px * var(--u)); align-items: center; margin-top: min(calc(18px * var(--u)), 2.4vh); }
  .cardface { height: min(calc(360px * var(--u)), 46vh); display: flex; flex-direction: column;
    background: var(--surface); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard);
    padding: min(calc(22px * var(--u)), 2.8vh) calc(24px * var(--u)); }
  .cardface .as { display: flex; align-items: center; gap: calc(10px * var(--u));
    font-family: var(--pixel); font-size: min(calc(20px * var(--u)), 2.4vh); color: var(--gold); }
  .cardface .as img { width: min(calc(42px * var(--u)), 5vh); height: auto; image-rendering: pixelated; }
  .cardface p { flex: 1; display: flex; align-items: center; margin: min(calc(14px * var(--u)), 1.8vh) 0 0;
    font-size: min(calc(28px * var(--u)), 3.4vh, 1.9vw); font-weight: 900; line-height: 1.6; }
  .cardback { display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: min(calc(360px * var(--u)), 46vh); border: 4px dashed var(--edge-soft); color: var(--ink-3);
    font-family: var(--pixel); font-size: min(calc(56px * var(--u)), 8vh); }
  /* 公布之後：每一張被挑走的卡（卡面 ＋ 挑的人） */
  .taken { flex: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: calc(16px * var(--u)); margin-top: min(calc(16px * var(--u)), 2vh); }
  .tk { flex: 0 1 calc(46% - 8px); min-width: 0; background: var(--surface);
    border: 4px solid var(--edge); box-shadow: 5px 5px 0 var(--hard);
    padding: min(calc(12px * var(--u)), 1.6vh) calc(18px * var(--u)); animation: unseal .45s ease-out; }
  .tk .as { font-family: var(--pixel); font-size: min(calc(16px * var(--u)), 2vh); color: var(--gold); }
  .tk .as b { font-family: var(--sans); float: right; font-size: min(calc(17px * var(--u)), 2.1vh); color: var(--ink-2); }
  .tk p { margin: min(calc(6px * var(--u)), .8vh) 0 0; font-size: min(calc(23px * var(--u)), 2.8vh, 1.5vw);
    font-weight: 900; line-height: 1.5; }

  /* ── 統計 ＋ 大魔王合體 ───────────────────────────────────────────── */
  .bars { display: flex; flex-direction: column; gap: min(calc(9px * var(--u)), 1.2vh);
    margin-top: min(calc(14px * var(--u)), 2vh); }
  .bar2 { display: grid; grid-template-columns: calc(170px * var(--u)) minmax(0, 1fr) calc(90px * var(--u));
    align-items: center; gap: calc(14px * var(--u)); }
  .bar2 .bl { display: flex; align-items: center; gap: calc(10px * var(--u));
    font-size: min(calc(26px * var(--u)), 3.2vh); font-weight: 900; white-space: nowrap; }
  .bar2 .bl img { width: min(calc(40px * var(--u)), 4.6vh); height: auto; image-rendering: pixelated; }
  .bar2 .bt { height: min(calc(26px * var(--u)), 3.2vh); border: 3px solid var(--edge); background: var(--surface-2); }
  .bar2 .bt i { display: block; height: 100%; background: var(--vol); transition: width .3s;
    -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px);
    mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px); }
  .bar2 .bn { font-family: var(--pixel); font-size: min(calc(19px * var(--u)), 2.4vh); color: var(--ink-2); }
  .bar2.zero { opacity: .4; }
  /* 被挑走的那幾張卡的原文（**不掛名字**） */
  .quotes { margin-top: min(calc(12px * var(--u)), 1.6vh); display: flex; flex-wrap: wrap; gap: calc(10px * var(--u)); }
  .quotes span { padding: 2px calc(12px * var(--u)); border: 3px solid var(--edge-soft);
    font-size: min(calc(18px * var(--u)), 2.2vh); font-weight: 700; color: var(--ink-2); }

  /* 魔王：帳單、鬧鐘、公事包疊出來的一隻巨人。**不准有角、尾巴、火。** */
  .bosswrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .bosswrap img { display: block; width: min(calc(330px * var(--u)), 40vh); height: auto;
    image-rendering: pixelated; animation: sway 2.8s steps(2) infinite; }
  .bosswrap img.broken { animation: none; opacity: .85; }
  @keyframes sway { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .bosswrap img { animation: none; } }
  .bossname { margin-top: min(calc(10px * var(--u)), 1.4vh); font-size: min(calc(46px * var(--u)), 5.6vh, 3.2vw);
    font-weight: 900; letter-spacing: .1em; }
  .bossname small { display: block; font-family: var(--pixel); font-size: min(calc(18px * var(--u)), 2.2vh);
    color: var(--gold); letter-spacing: .06em; margin-bottom: min(calc(6px * var(--u)), .8vh); }
  .hpbar { width: min(calc(560px * var(--u)), 62vw); margin-top: min(calc(12px * var(--u)), 1.6vh);
    border: 4px solid var(--edge); background: var(--surface-2); height: min(calc(30px * var(--u)), 3.6vh); }
  .hpbar i { display: block; height: 100%; background: var(--vol); transition: width .45s ease; }
  .hpnum { margin-top: min(calc(6px * var(--u)), .8vh); font-family: var(--pixel);
    font-size: min(calc(22px * var(--u)), 2.7vh); color: var(--vol); }
  .hpnum.heal { color: var(--ink-3); }
  /* 打鬥和結算那兩頁：魔王縮成一條橫的，底下才排得下四招 —— 血條照樣是主角 */
  .bosswrap.mini { flex: none; flex-direction: row; align-items: center; gap: calc(20px * var(--u));
    margin-top: min(calc(12px * var(--u)), 1.6vh); }
  .bosswrap.mini img { width: min(calc(112px * var(--u)), 13vh); }
  .bosswrap.mini .bossname { margin: 0; flex: none; font-size: min(calc(26px * var(--u)), 3.2vh); letter-spacing: .04em; }
  .bosswrap.mini .bossname small { font-size: min(calc(14px * var(--u)), 1.8vh); margin-bottom: 2px; }
  .bosswrap.mini .hpbar { flex: 1; width: auto; margin-top: 0; height: min(calc(26px * var(--u)), 3.2vh); }
  .bosswrap.mini .hpnum { flex: none; margin-top: 0; width: 16em; text-align: right; }

  /* ── 靠自己打 ─────────────────────────────────────────────────────── */
  .atk { display: flex; align-items: baseline; gap: calc(18px * var(--u)); flex-wrap: wrap;
    margin-top: min(calc(10px * var(--u)), 1.4vh); }
  .atk .as { font-family: var(--pixel); font-size: min(calc(20px * var(--u)), 2.5vh); color: var(--gold); }
  .atk .line { font-size: min(calc(40px * var(--u)), 5vh, 2.9vw); font-weight: 900; }
  .mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(14px * var(--u));
    margin-top: min(calc(16px * var(--u)), 2vh); }
  .mv { background: var(--surface); border: 4px solid var(--edge); box-shadow: 5px 5px 0 var(--hard);
    padding: min(calc(12px * var(--u)), 1.6vh) calc(16px * var(--u)); min-width: 0; }
  .mv b { font-size: min(calc(26px * var(--u)), 3.2vh, 1.6vw); white-space: nowrap; }
  .mv .dmg { display: block; margin-top: min(calc(4px * var(--u)), .6vh); font-family: var(--pixel);
    font-size: min(calc(17px * var(--u)), 2.1vh); color: var(--vol); }
  .mv .dmg.miss { color: var(--ink-3); }
  .mv .n { display: block; margin-top: min(calc(6px * var(--u)), .8vh); font-family: var(--pixel);
    font-size: min(calc(16px * var(--u)), 2vh); color: var(--ink-3); }
  .mv .t { margin-top: min(calc(6px * var(--u)), .8vh); font-size: min(calc(18px * var(--u)), 2.2vh);
    line-height: 1.5; color: var(--ink-2); }
  .mv .who { margin-top: min(calc(4px * var(--u)), .6vh); font-size: min(calc(15px * var(--u)), 1.9vh);
    font-weight: 700; color: var(--ink-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ── 勞苦重擔的不幸人生 ───────────────────────────────────────────── */
  .endgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(14px * var(--u));
    margin-top: min(calc(18px * var(--u)), 2.4vh); }
  .endcell { background: var(--surface); border: 4px solid var(--edge); box-shadow: 5px 5px 0 var(--hard);
    padding: min(calc(14px * var(--u)), 1.8vh) calc(16px * var(--u)); text-align: center; }
  .endcell b { display: block; font-size: min(calc(24px * var(--u)), 2.9vh); white-space: nowrap; }
  .endcell em { display: block; margin-top: min(calc(6px * var(--u)), .8vh); font-style: normal;
    font-family: var(--pixel); font-size: min(calc(30px * var(--u)), 3.6vh); color: var(--vol); }

  /* ── 十字架（過場動畫）───────────────────────────────────────────── */
  /* ⚠️ 不准血腥：沒有血、沒有釘子特寫、沒有痛苦的臉。重量靠停頓。 */
  .cross { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; }
  .cross .line { font-size: min(calc(46px * var(--u)), 5.6vh, 3.2vw); font-weight: 900; letter-spacing: .04em;
    white-space: nowrap; }
  .cross img { display: block; image-rendering: pixelated; }
  .cross .boss { width: min(calc(280px * var(--u)), 34vh); }
  .cross .boss.raise { animation: raise 1.6s ease-in-out infinite alternate; }
  @keyframes raise { from { transform: translateY(0) scale(1); } to { transform: translateY(-10px) scale(1.04); } }
  .cross .him { width: min(calc(260px * var(--u)), 32vh); animation: stepin .8s ease-out; }
  @keyframes stepin { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
  /* 第三段：暗場，只剩一個十字架的剪影，底下三天一格一格亮 */
  .stage.phase-cross.dark { background: #0B0F0E; }
  .cross.dark { color: #E7EFEA; }
  .cross .crossart { width: min(calc(230px * var(--u)), 30vh); }
  .days { display: flex; gap: calc(22px * var(--u)); margin-top: min(calc(24px * var(--u)), 3vh); }
  .days span { padding: min(calc(10px * var(--u)), 1.3vh) calc(26px * var(--u));
    border: 4px solid #2B3A36; color: #4A5D57; font-size: min(calc(26px * var(--u)), 3.2vh); font-weight: 900; }
  .days span.on { border-color: var(--gold); color: var(--gold); animation: unseal .5s ease-out; }
  .days span.last.on { border-color: var(--root-c); color: var(--root-c); }
  .crossdone { margin-top: min(calc(18px * var(--u)), 2.4vh); font-size: min(calc(20px * var(--u)), 2.5vh);
    font-family: var(--pixel); color: var(--root-c); }
  @keyframes unseal { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* ── 復活的大能 ───────────────────────────────────────────────────── */
  .powerart img { display: block; width: min(calc(420px * var(--u)), 46vh, 34vw); height: auto;
    image-rendering: pixelated; margin: 0 auto; }

  /* ── 在生活中得勝（集體挑戰）──────────────────────────────────────── */
  .hitgrid { flex: 1; display: flex; flex-direction: column; justify-content: center;
    gap: min(calc(12px * var(--u)), 1.6vh); margin-top: min(calc(14px * var(--u)), 1.8vh); }
  .hitrow { display: grid; grid-template-columns: calc(220px * var(--u)) minmax(0, 1fr) calc(230px * var(--u));
    align-items: center; gap: calc(16px * var(--u)); background: var(--surface);
    border: 4px solid var(--edge); box-shadow: 5px 5px 0 var(--hard);
    padding: min(calc(10px * var(--u)), 1.4vh) calc(18px * var(--u)); animation: unseal .4s ease-out; }
  .hitrow.lit { border-color: var(--root-c); }
  .hitrow .who { font-size: min(calc(28px * var(--u)), 3.4vh); font-weight: 900; white-space: nowrap; }
  .hitrow .who i { display: block; font-style: normal; font-family: var(--pixel);
    font-size: min(calc(15px * var(--u)), 1.9vh); color: var(--gold); }
  .hitrow .what { min-width: 0; font-size: min(calc(22px * var(--u)), 2.7vh); font-weight: 700;
    line-height: 1.45; color: var(--ink-2); }
  .hitrow .pr { text-align: right; font-family: var(--pixel); font-size: min(calc(18px * var(--u)), 2.2vh);
    color: var(--ink-3); white-space: nowrap; }
  .hitrow.lit .pr { color: var(--root-c); }
  .hitrow .pr .hearts { font-family: var(--sans); letter-spacing: .1em; }
  /* 全場共用的能量條。**一格一個被打中的人** —— 不是按了幾次。 */
  .energy { margin-top: min(calc(14px * var(--u)), 1.8vh); }
  .energy .el { display: flex; justify-content: space-between; font-family: var(--pixel);
    font-size: min(calc(17px * var(--u)), 2.1vh); color: var(--ink-3); margin-bottom: 6px; }
  .energy .cells { display: flex; gap: calc(8px * var(--u)); }
  .energy .cells i { flex: 1; height: min(calc(28px * var(--u)), 3.4vh); border: 4px solid var(--edge);
    background: var(--surface-2); }
  .energy .cells i.on { background: var(--root-c); border-color: var(--root-c); }
  .energy.full .el { color: var(--root-c); }

  /* ── 這一仗，全場一起打贏 ─────────────────────────────────────────── */
  .wonhead { display: flex; align-items: baseline; gap: calc(18px * var(--u)); flex-wrap: wrap; }
  .wonhead .sub { font-size: min(calc(24px * var(--u)), 3vh); font-weight: 900; color: var(--gold); }

  /* 經文。用 em 限行長：ch 在中文字體上量的是數字寬度，會把整段擠成一條 */
  .verse { margin-top: calc(10px * var(--u)); }
  .verse blockquote { font-size: min(calc(38px * var(--u)), 4.4vh); font-weight: 900; line-height: 1.6;
    margin: 18px 0 0; max-width: 22em; }
  .verse .ref { font-family: var(--pixel); color: var(--gold); font-size: calc(20px * var(--u)); }
  .verse blockquote .ref { display: block; margin-top: calc(14px * var(--u)); }

  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 18px; }
  .col3 { background: var(--surface); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard); padding: min(18px, 2.4vh) 18px; }
  .col3 h3 { display: flex; align-items: baseline; gap: 10px; font-size: calc(22px * var(--u)); margin-bottom: 8px; }
  .col3 h3.next { font-size: calc(26px * var(--u)); }
  .col3 .who { font-size: calc(28px * var(--u)); font-weight: 900; display: block; margin: 0; }
  .col3 .delta { margin: calc(6px * var(--u)) 0 0; font-family: var(--pixel);
    font-size: calc(15px * var(--u)); color: var(--ink-3); }
  .col3 .delta b { margin-left: 10px; font-size: calc(17px * var(--u)); }
  .nextbox { margin-top: calc(16px * var(--u)); }

  .note { background: var(--surface); border: 3px solid var(--edge); border-left-width: 10px; border-left-color: var(--gold);
    padding: 14px 16px; margin-top: calc(16px * var(--u)); max-width: 70ch; font-size: calc(14px * var(--u)); color: var(--ink-2); box-shadow: 5px 5px 0 var(--hard); }
  .note b { color: var(--ink); }

  /* HUD 控制列：固定深底淺字，不隨主題翻轉 */
  .controls { display: flex; gap: 10px; align-items: center; padding: 12px 20px;
    background: var(--bar-bg); border-top: 4px solid var(--bar-edge); flex-wrap: wrap; }
  .controls .btn { padding: 9px 14px; font-size: calc(13px * var(--u)); background: #1D2A2C; border: 3px solid var(--bar-edge);
    color: var(--bar-ink); box-shadow: 3px 3px 0 #000; }
  .controls .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .controls .btn.primary { background: var(--root-c); border-color: #9CF0D6; color: var(--on-primary); }
  .controls select { background: #1D2A2C; color: var(--bar-ink); border: 3px solid var(--bar-edge);
    padding: 9px 10px; font-family: var(--sans); font-weight: 700; font-size: calc(13px * var(--u)); }
  .controls .sp { flex: 1; }
  .controls .hint { color: #8FA8A1; font-size: calc(13px * var(--u)); font-family: var(--pixel); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1><a href="/happiness/zh-TW/" id="home" title="回系列頁">幸福模擬器</a> · 第六關 <b>十字架的勝利</b></h1>
    <span class="tag" id="ptag">入場</span>
    <span class="spacer"></span>
    <button class="notesbtn" id="notesbtn" title="用手機掃，備忘錄會跟著大螢幕走">📱 主持人備忘錄</button>
    <button class="themebtn" data-theme-toggle></button>
    <span class="count" id="pcount">0 人在場</span>
  </div>

  <div class="body">
    <aside class="side">
      <h4>玩家狀態</h4>
      <div id="plist"></div>
    </aside>
    <main class="stage" id="stage"></main>
  </div>

  <div class="controls">
    <button class="btn" data-cmd="prev">← 上一頁</button>
    <button class="btn primary" data-cmd="next">下一頁 →</button>
    <select id="jump"></select>
    <!-- 每一頁該有的控制鈕。現場不要靠鍵盤。 -->
    <span id="cardsctl" style="display:none;gap:8px;">
      <button class="btn primary" data-cmd="cardsReveal" id="creveal">公布結果</button>
      <button class="btn" data-cmd="cardsRedeal">重挑</button>
    </span>
    <span id="bossctl" style="display:none;gap:8px;">
      <button class="btn primary" data-cmd="bossMerge" id="bmerge">合體</button>
    </span>
    <span id="fightctl" style="display:none;gap:8px;">
      <button class="btn" data-cmd="fightPrev" id="fprev">← 上一回合</button>
      <button class="btn primary" data-cmd="fightStep" id="fstep">公布結果</button>
      <button class="btn" data-cmd="fightRestart">重跑第一回合</button>
    </span>
    <!-- 十字架：四段一段一段走。**每一段的停頓都不准省。** -->
    <span id="crossctl" style="display:none;gap:8px;">
      <button class="btn" data-cmd="crossBack" id="cback">← 上一步</button>
      <button class="btn primary" data-cmd="crossNext" id="cnext">下一步</button>
    </span>
    <span id="togetherctl" style="display:none;gap:8px;">
      <button class="btn" data-cmd="togetherPrev" id="tprev">← 上一回合</button>
      <button class="btn primary" data-cmd="togetherStep" id="tstep">出招</button>
      <button class="btn" data-cmd="wonAll" id="wonall">全場得勝</button>
    </span>
    <!-- 第 13 頁：翻開「在耶穌基督裡的好」 -->
    <span id="wonctl" style="display:none;gap:8px;">
      <button class="btn primary" data-cmd="goodOpen" id="gopen">翻開</button>
    </span>
    <span class="sp"></span>
    <span class="hint" id="hint"></span>
    <button class="btn" data-cmd="reset" id="resetbtn">全部重置</button>
  </div>
</div>

<!-- 主持人備忘錄的 QR：按 N 叫出來，平常收著 -->
<div class="notesqr" id="notesqr">
  <canvas id="notesqrc"></canvas>
  <div class="t">
    <h3>主持人備忘錄</h3>
    <p>用你自己的手機掃。這一頁會跟著大螢幕走，每一頁該念什麼、該做什麼、不要做什麼都在上面，也可以直接翻頁。</p>
    <div class="u" id="notesurl"></div>
    <div class="esc">再按一次 N 或 Esc 收起來</div>
  </div>
</div>

<script src="/happiness/shared/qr.js"></script>
<script src="/happiness/shared/room-client.js"></script>
<script src="/happiness/shared/stage-parts.js"></script>
<script src="/happiness/w6/host.js"></script>
</body>
</html>
