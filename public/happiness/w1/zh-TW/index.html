<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幸福模擬器 · 第一關 真幸福 · 主畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/happiness/shared/pixel.css">
<style>
  body { overflow: hidden; }
  .app { display: grid; grid-template-rows: auto 1fr auto auto; height: 100vh; }

  .top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; border-bottom: 4px solid var(--edge); background: var(--surface);
  }
  .top h1 { font-size: 19px; font-weight: 900; }
  .top .clock { font-family: var(--pixel); font-size: 11px; color: var(--ink-3); }
  .top .spacer { flex: 1; }
  .top .count { font-family: var(--pixel); font-size: 11px; color: var(--ink-2); }

  .body { display: grid; grid-template-columns: 272px 1fr; min-height: 0; }

  .side { border-right: 4px solid var(--edge); background: var(--surface); overflow-y: auto; padding: 14px; }
  .side h4 { font-family: var(--pixel); font-size: 10px; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 12px; text-transform: uppercase; }
  .prow { padding: 10px 0; border-bottom: 2px dashed var(--edge-soft); }
  .prow .nm { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
  .prow .nm .val { margin-left: auto; font-family: var(--pixel); font-size: 13px; color: var(--vol); }
  .prow .bars { display: grid; gap: 4px; margin: 7px 0 6px; }
  .prow .bars .bar { height: 13px; }
  .prow .meta { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--ink-3); font-family: var(--pixel); }
  .prow .meta b { color: var(--ink-2); }
  .chip { font-family: var(--sans); font-size: 11px; font-weight: 700; padding: 1px 6px; border: 2px solid var(--edge-soft); background: var(--surface-2); color: var(--ink-2); }
  .chip.on { border-color: var(--root-c); background: var(--root-soft); color: var(--root-c); }
  .adj { margin-left: auto; display: flex; gap: 4px; }
  .adj button { width: 24px; height: 22px; line-height: 1; padding: 0; font-size: 13px; font-weight: 700;
    border: 2px solid var(--edge); background: var(--ground); color: var(--ink); box-shadow: 2px 2px 0 var(--hard); }
  .adj button:active { transform: translate(2px, 2px); box-shadow: none; }

  .stage { padding: 28px 40px; overflow-y: auto; display: flex; flex-direction: column; }
  .stage h2 { font-size: 40px; font-weight: 900; letter-spacing: .02em; }
  .stage .lede { font-size: 17px; color: var(--ink-2); max-width: 62ch; margin: 12px 0 0; }
  .big { font-size: 76px; font-family: var(--pixel); line-height: 1.1; }
  .mono { font-family: var(--pixel); }
  .muted { color: var(--ink-3); }

  .qrbox { display: flex; gap: 34px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
  .qrbox > div { flex: 1 1 280px; min-width: 0; }
  /* QR 要蓋在掃描線上面，不然會影響掃描 */
  .qrbox canvas { width: 276px; height: 276px; border: 4px solid var(--edge); background: #fff; padding: 6px;
    box-shadow: 8px 8px 0 var(--hard); position: relative; z-index: 95; }
  .roomcode { font-family: var(--pixel); font-size: 64px; color: var(--gold); letter-spacing: .14em; margin-top: 8px; }
  .url { font-family: var(--pixel); font-size: 15px; line-height: 1.8; color: var(--root-c); word-break: break-all; }
  .names { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .names span { padding: 6px 12px; background: var(--surface); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--hard); font-size: 15px; font-weight: 700; }

  .hist { display: flex; align-items: flex-end; gap: 10px; height: 210px; margin-top: 26px; }
  .hist .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
  .hist .col i { display: block; width: 100%; background: var(--vol); border: 3px solid var(--edge); border-bottom: 0; min-height: 4px;
    -webkit-mask-image: repeating-linear-gradient(0deg, #000 0 10px, transparent 10px 13px);
    mask-image: repeating-linear-gradient(0deg, #000 0 10px, transparent 10px 13px); }
  .hist .col b { font-family: var(--pixel); font-size: 10px; color: var(--ink-3); font-weight: 400; }
  .hist .col em { font-family: var(--pixel); font-size: 12px; font-style: normal; color: var(--ink-2); }

  .timerbox { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tnum { font-family: var(--pixel); font-size: 62px; color: var(--vol); line-height: 1; }
  .tblocks { display: flex; gap: 3px; }
  .tb { display: block; width: 13px; height: 34px; border: 3px solid var(--edge); background: var(--surface-2); }
  .tb.on { background: var(--vol); }
  .auction-row { display: flex; align-items: center; gap: 46px; margin-top: 24px; }
  .lotname { font-size: 58px; font-weight: 900; line-height: 1.2; letter-spacing: .04em; }
  .lotidx { font-family: var(--pixel); color: var(--ink-3); font-size: 12px; }

  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
  .col3 { background: var(--surface); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--hard); padding: 18px; }
  .col3 h3 { font-size: 17px; margin-bottom: 10px; }
  .col3 .who { font-size: 28px; font-weight: 900; }
  .col3 .say { margin-top: 12px; font-size: 14px; font-weight: 700; color: var(--vol); }
  .col3 ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }

  .hitcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; margin-top: 22px; }
  .hitcard { background: var(--surface); border: 4px solid var(--edge); border-left-width: 12px; border-left-color: var(--vol);
    box-shadow: 6px 6px 0 var(--hard); padding: 16px; }
  .hitcard .hd { display: flex; justify-content: space-between; font-family: var(--pixel); font-size: 10px; color: var(--ink-3); }
  .hitcard .hd b { font-size: 14px; color: var(--vol); }
  .hitcard p { margin: 12px 0 0; font-size: 15px; line-height: 1.8; }
  .hitcard .nm { margin-top: 12px; font-size: 14px; font-weight: 700; color: var(--ink-2); }

  .verse { max-width: 30ch; }
  .verse blockquote { font-size: 48px; font-weight: 900; line-height: 1.6; margin: 18px 0 0; }
  .verse .ref { font-family: var(--pixel); color: var(--gold); font-size: 13px; }

  .note { background: var(--surface); border: 3px solid var(--edge); border-left-width: 10px; border-left-color: var(--gold);
    padding: 14px 16px; margin-top: 22px; max-width: 70ch; font-size: 14px; color: var(--ink-2); box-shadow: 5px 5px 0 var(--hard); }
  .note b { color: var(--ink); }

  .energy { display: flex; align-items: center; gap: 14px; padding: 10px 24px; border-top: 4px solid var(--edge);
    background: var(--surface); font-family: var(--pixel); font-size: 11px; color: var(--ink-2); }
  .energy .bar { flex: 1; height: 18px; }

  /* HUD 控制列：固定深底淺字，不隨主題翻轉 */
  .controls { display: flex; gap: 10px; align-items: center; padding: 12px 20px;
    background: var(--bar-bg); border-top: 4px solid var(--bar-edge); flex-wrap: wrap; }
  .controls .btn { padding: 9px 14px; font-size: 13px; background: #1D2A2C; border: 3px solid var(--bar-edge);
    color: var(--bar-ink); box-shadow: 3px 3px 0 #000; }
  .controls .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .controls .btn.primary { background: var(--root-c); border-color: #9CF0D6; color: var(--on-primary); }
  .controls select { background: #1D2A2C; color: var(--bar-ink); border: 3px solid var(--bar-edge);
    padding: 9px 10px; font-family: var(--sans); font-weight: 700; font-size: 13px; }
  .controls .sp { flex: 1; }
  .controls .hint { color: #8FA8A1; font-size: 11px; font-family: var(--pixel); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>幸福模擬器 · 第一關 <b>真幸福</b></h1>
    <span class="tag" id="ptag">入場</span>
    <span class="clock" id="pclock">—</span>
    <span class="spacer"></span>
    <span class="count" id="pcount">0 人在場</span>
  </div>

  <div class="body">
    <aside class="side">
      <h4>玩家狀態</h4>
      <div id="plist"></div>
    </aside>
    <main class="stage" id="stage"></main>
  </div>

  <div class="energy">
    <span>全場幸福能量</span>
    <span class="bar"><i id="energybar" style="width:0%;background:var(--gold)"></i></span>
    <span id="energyval">—</span>
  </div>

  <div class="controls">
    <button class="btn" data-cmd="prev">← 上一頁</button>
    <button class="btn primary" data-cmd="next">下一頁 →</button>
    <select id="jump"></select>
    <span id="auctionctl" style="display:none;gap:8px;">
      <button class="btn" data-cmd="nextLot">下一項 / 立即開標</button>
      <button class="btn" data-cmd="extend">+15 秒</button>
      <button class="btn" data-cmd="toggleWait" id="waitbtn">每項之間等我：關</button>
      <button class="btn" data-cmd="restartAuction">重跑拍賣</button>
    </span>
    <button class="btn" data-cmd="redeal" id="redealbtn" style="display:none">重發事件卡</button>
    <span class="sp"></span>
    <span class="hint" id="hint"></span>
    <button class="btn" data-cmd="reset" id="resetbtn">全部重置</button>
  </div>
</div>

<script src="/happiness/shared/qr.js"></script>
<script src="/happiness/shared/room-client.js"></script>
<script src="/happiness/w1/host.js"></script>
</body>
</html>
