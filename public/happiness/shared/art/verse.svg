<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 18" shape-rendering="crispEdges" role="img" aria-label="領受"><style>.sp{animation:tw 2.6s steps(1) infinite}@keyframes tw{0%,45%{opacity:.15}50%,95%{opacity:1}100%{opacity:.15}}.beat{animation:bt 2.6s steps(1) infinite;transform-origin:16px 10px}@keyframes bt{0%,70%{transform:translateY(0)}75%,85%{transform:translateY(-1px)}100%{transform:translateY(0)}}.rise{animation:rs 3.4s steps(1) infinite}@keyframes rs{0%{opacity:0;transform:translateY(2px)}25%{opacity:1}70%{opacity:1;transform:translateY(-3px)}100%{opacity:0;transform:translateY(-4px)}}</style><g class="beat"><rect x="11" y="3" width="3" height="1" fill="#FF6F43"/><rect x="18" y="3" width="3" height="1" fill="#FF6F43"/><rect x="10" y="4" width="12" height="1" fill="#FF6F43"/><rect x="10" y="5" width="12" height="1" fill="#FF6F43"/><rect x="10" y="6" width="12" height="1" fill="#C4491A"/><rect x="11" y="7" width="10" height="1" fill="#C4491A"/><rect x="12" y="8" width="8" height="1" fill="#C4491A"/><rect x="13" y="9" width="6" height="1" fill="#C4491A"/><rect x="14" y="10" width="4" height="1" fill="#C4491A"/><rect x="15" y="11" width="2" height="1" fill="#C4491A"/></g><g class="sp" style="animation-delay:0s"><rect x="2" y="4" width="1" height="1" fill="#F0C64B"/><rect x="1" y="5" width="3" height="1" fill="#F0C64B"/><rect x="2" y="6" width="1" height="1" fill="#F0C64B"/></g><g class="sp" style="animation-delay:0.9s"><rect x="27" y="3" width="1" height="1" fill="#F0C64B"/><rect x="26" y="4" width="3" height="1" fill="#F0C64B"/><rect x="27" y="5" width="1" height="1" fill="#F0C64B"/></g><g class="sp" style="animation-delay:1.7s"><rect x="4" y="12" width="1" height="1" fill="#F0C64B"/><rect x="3" y="13" width="3" height="1" fill="#F0C64B"/><rect x="4" y="14" width="1" height="1" fill="#F0C64B"/></g></svg>
