     手是打開的 —— 接收和給予是同一個動作。會動的只有心旁邊那一圈光和星星，慢慢的。
     ⚠️ 光不准用半透明方塊（深色底上會變成灰盒子），只用貼著心的一圈淡黃和幾道光點。 -->
