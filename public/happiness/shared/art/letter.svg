<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 18" shape-rendering="crispEdges" role="img" aria-label="還沒拆的信">
<!-- 封著的信。第二關的寶箱是同一個做法：關著的那一張會輕輕浮動，
     按下去才換成打開的那一張。**不要自己跑** —— 要等主持人按。 -->
<rect x="1" y="4" width="22" height="11" fill="#9C7C3E"/>
<rect x="2" y="5" width="20" height="9" fill="#E8DCBF"/>
<!-- 蓋下來的封口 -->
<rect x="2" y="5" width="20" height="1" fill="#D6C49C"/>
<rect x="4" y="6" width="16" height="1" fill="#D6C49C"/>
<rect x="6" y="7" width="12" height="1" fill="#D6C49C"/>
<rect x="8" y="8" width="8" height="1" fill="#D6C49C"/>
<rect x="10" y="9" width="4" height="1" fill="#D6C49C"/>
<!-- 火漆印。還沒拆。 -->
<rect x="11" y="8" width="3" height="3" fill="#C4491A"/>
<rect x="12" y="9" width="1" height="1" fill="#8E2F10"/>
</svg>
