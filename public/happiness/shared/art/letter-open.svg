<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 18" shape-rendering="crispEdges" role="img" aria-label="拆開的信">
<!-- 拆開的信：封口翻上去，信紙從裡面抽出來。
     ⚠️ 信紙上**不要畫字**，畫面上的經文才是內容 —— 小圖上的假字在 2–4 公尺外是雜訊。 -->
<!-- 翻上去的封口 -->
<rect x="8" y="0" width="8" height="1" fill="#D6C49C"/>
<rect x="6" y="1" width="12" height="1" fill="#D6C49C"/>
<rect x="4" y="2" width="16" height="1" fill="#D6C49C"/>
<rect x="2" y="3" width="20" height="1" fill="#D6C49C"/>
<!-- 抽出來的信紙 -->
<rect x="5" y="1" width="14" height="12" fill="#9C7C3E"/>
<rect x="6" y="2" width="12" height="11" fill="#F8F4E8"/>
<rect x="8" y="4" width="8" height="1" fill="#9EAAA2"/>
<rect x="8" y="6" width="8" height="1" fill="#9EAAA2"/>
<rect x="8" y="8" width="8" height="1" fill="#9EAAA2"/>
<rect x="8" y="10" width="5" height="1" fill="#9EAAA2"/>
<!-- 信封的前片，壓在信紙下半 -->
<rect x="1" y="11" width="22" height="6" fill="#9C7C3E"/>
<rect x="2" y="12" width="20" height="4" fill="#E8DCBF"/>
<!-- 跟第三通那支專線同一組的綠訊號：它真的回了 -->
<rect x="20" y="5" width="1" height="1" fill="#54D6AF"/>
<rect x="21" y="4" width="1" height="1" fill="#54D6AF"/>
<rect x="22" y="3" width="1" height="1" fill="#54D6AF"/>
</svg>
