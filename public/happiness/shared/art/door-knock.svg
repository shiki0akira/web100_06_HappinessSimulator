<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" shape-rendering="crispEdges" role="img" aria-label="有人在敲門">
<!-- 第五關的門。門兩邊的記號是敲門聲：叩、叩，然後停很久。輕、慢、固定間隔 —— **不准越敲越快、不准閃。** -->
<style>.k1{animation:k1 3.6s steps(1) infinite}@keyframes k1{0%,39%{opacity:1}40%,100%{opacity:0}}.k2{animation:k2 3.6s steps(1) infinite}@keyframes k2{0%,14%{opacity:0}15%,39%{opacity:1}40%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){.k1,.k2{animation:none}}</style>
<rect x="6" y="1" width="18" height="1" fill="#8A9C96"/><rect x="6" y="1" width="2" height="28" fill="#8A9C96"/><rect x="22" y="1" width="2" height="28" fill="#8A9C96"/><rect x="8" y="2" width="14" height="27" fill="#9A6B45"/><rect x="8" y="2" width="14" height="1" fill="#B98457"/><rect x="10" y="4" width="10" height="9" fill="#7A5234"/><rect x="11" y="5" width="8" height="7" fill="#9A6B45"/><rect x="10" y="16" width="10" height="11" fill="#7A5234"/><rect x="11" y="17" width="8" height="9" fill="#9A6B45"/><rect x="14" y="7" width="2" height="2" fill="#54D6AF"/><rect x="14" y="7" width="2" height="1" fill="#9CF0D6"/><rect x="18" y="14" width="3" height="2" fill="#F0C64B"/><rect x="18" y="14" width="3" height="1" fill="#FFE885"/><rect x="2" y="29" width="26" height="1" fill="#8A9C96" opacity=".6"/><g class="k1"><rect x="25" y="10" width="1" height="1" fill="#F0C64B"/><rect x="26" y="11" width="1" height="3" fill="#F0C64B"/><rect x="25" y="14" width="1" height="1" fill="#F0C64B"/><rect x="4" y="10" width="1" height="1" fill="#F0C64B"/><rect x="3" y="11" width="1" height="3" fill="#F0C64B"/><rect x="4" y="14" width="1" height="1" fill="#F0C64B"/></g><g class="k2"><rect x="27" y="10" width="1" height="1" fill="#F0C64B"/><rect x="28" y="11" width="1" height="3" fill="#F0C64B"/><rect x="27" y="14" width="1" height="1" fill="#F0C64B"/><rect x="2" y="10" width="1" height="1" fill="#F0C64B"/><rect x="1" y="11" width="1" height="3" fill="#F0C64B"/><rect x="2" y="14" width="1" height="1" fill="#F0C64B"/></g>
</svg>
